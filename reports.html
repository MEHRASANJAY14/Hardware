<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPGB Hardware Management - Reports</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f5;
    color:#222;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:245px;
    height:100vh;
    background:#006400;
    color:#fff;
    padding:22px 14px;
    z-index:1000;
    box-shadow:3px 0 12px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:28px;
}

.logo small{
    display:block;
    font-size:11px;
    font-weight:normal;
    margin-top:5px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    text-decoration:none;
    padding:13px 14px;
    border-radius:9px;
    margin:5px 0;
    font-size:14px;
    transition:.2s;
}

.menu a:hover{
    background:#00823b;
}

.menu a.active{
    background:#00823b;
    box-shadow:inset 4px 0 #fff;
}

.menu i{
    width:22px;
    text-align:center;
    font-style:normal;
    font-size:18px;
}

/* ================= MAIN ================= */

.main{
    margin-left:245px;
    padding:25px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.header h1{
    color:#006400;
    font-size:27px;
}

.header p{
    color:#777;
    margin-top:5px;
}

/* ================= CONTROLS ================= */

.controls{
    background:#fff;
    padding:18px;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    margin-bottom:20px;
}

.controls-row{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
}

select,
input{
    padding:11px 13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:14px;
    background:#fff;
}

input{
    min-width:240px;
}

button{
    border:none;
    padding:11px 18px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
    font-size:14px;
}

.btn-green{
    background:#006400;
    color:#fff;
}

.btn-green:hover{
    background:#00823b;
}

.btn-blue{
    background:#1c4fa3;
    color:#fff;
}

.btn-gray{
    background:#666;
    color:#fff;
}

/* ================= CARDS ================= */

.cards{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:15px;
    margin-bottom:22px;
}

.card{
    background:#fff;
    border-radius:12px;
    padding:18px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    border-left:5px solid #006400;
}

.card-title{
    color:#777;
    font-size:13px;
}

.card-value{
    font-size:27px;
    font-weight:bold;
    margin-top:7px;
    color:#006400;
}

/* ================= REPORT ================= */

.report-box{
    background:#fff;
    border-radius:12px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    overflow:hidden;
}

.report-header{
    padding:18px 20px;
    border-bottom:1px solid #eee;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.report-header h2{
    color:#006400;
    font-size:20px;
}

.report-info{
    color:#777;
    font-size:13px;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#006400;
    color:#fff;
    padding:12px 10px;
    font-size:13px;
    white-space:nowrap;
}

td{
    padding:11px 10px;
    border-bottom:1px solid #eee;
    font-size:13px;
    white-space:nowrap;
}

tbody tr:hover{
    background:#f3faf5;
}

.text-center{
    text-align:center;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
}

.badge-working{
    background:#d9f5df;
    color:#08752a;
}

.badge-not{
    background:#ffe0e0;
    color:#a30000;
}

.badge-repair{
    background:#fff0c9;
    color:#8a6200;
}

.badge-damaged{
    background:#e5e5e5;
    color:#555;
}

.empty{
    text-align:center;
    padding:35px;
    color:#777;
}

/* ================= PRINT ================= */

@media print{

    .sidebar,
    .controls,
    .header button{
        display:none !important;
    }

    .main{
        margin-left:0;
        padding:10px;
    }

    body{
        background:#fff;
    }

    .report-box{
        box-shadow:none;
    }

    .report-header{
        border-bottom:1px solid #000;
    }

    th{
        background:#ddd !important;
        color:#000 !important;
    }
}

/* ================= MOBILE ================= */

@media(max-width:1000px){

    .cards{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:800px){

    .sidebar{
        width:70px;
        padding:15px 8px;
    }

    .logo{
        font-size:0;
    }

    .logo:before{
        content:"MP";
        font-size:20px;
    }

    .logo small,
    .menu span{
        display:none;
    }

    .menu a{
        justify-content:center;
        padding:12px;
    }

    .main{
        margin-left:70px;
        padding:15px;
    }

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .header{
        display:block;
    }

    input{
        min-width:100%;
    }
}

@media(max-width:500px){

    .cards{
        grid-template-columns:1fr;
    }

    .controls-row{
        flex-direction:column;
        align-items:stretch;
    }

    select,
    input,
    button{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        MPGB
        <small>Hardware Management</small>
    </div>

    <nav class="menu">

        <a href="index.html">
            <i>⌂</i>
            <span>Dashboard</span>
        </a>

        <a href="add-hardware.html">
            <i>＋</i>
            <span>Add Hardware</span>
        </a>

        <a href="records.html">
            <i>▣</i>
            <span>Hardware Records</span>
        </a>

        <a href="edit-hardware.html">
            <i>✎</i>
            <span>Edit / Update</span>
        </a>

        <a href="branch-summary.html">
            <i>▥</i>
            <span>Branch Summary</span>
        </a>

        <a href="hardware-summary.html">
            <i>◈</i>
            <span>Hardware Summary</span>
        </a>

        <a href="reports.html">
            <i>▤</i>
            <span>Reports</span>
        </a>

    </nav>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <div class="header">

        <div>
            <h1>Reports</h1>
            <p>MPGB Hardware Management - Detailed Reports</p>
        </div>

        <button class="btn-blue" onclick="window.print()">
            🖨 Print Report
        </button>

    </div>


    <!-- ================= CONTROLS ================= -->

    <div class="controls">

        <div class="controls-row">

            <select id="reportType" onchange="changeReport()">

                <option value="branch">
                    Branch-wise Report
                </option>

                <option value="hardware">
                    Hardware-wise Report
                </option>

            </select>


            <input
                type="text"
                id="search"
                placeholder="Search branch / hardware..."
                onkeyup="applyFilter()"
            >

            <button
                class="btn-green"
                onclick="loadReports()">
                ↻ Refresh
            </button>

            <button
                class="btn-gray"
                onclick="exportCSV()">
                ⬇ Export CSV
            </button>

        </div>

    </div>


    <!-- ================= CARDS ================= -->

    <div class="cards">

        <div class="card">
            <div class="card-title">
                Total Hardware
            </div>
            <div class="card-value" id="total">
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Working
            </div>
            <div class="card-value" id="working">
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Not Working
            </div>
            <div class="card-value" id="notWorking">
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Under Repair
            </div>
            <div class="card-value" id="repair">
                0
            </div>
        </div>


        <div class="card">
            <div class="card-title">
                Damaged
            </div>
            <div class="card-value" id="damaged">
                0
            </div>
        </div>

    </div>


    <!-- ================= REPORT TABLE ================= -->

    <div class="report-box">

        <div class="report-header">

            <div>

                <h2 id="reportTitle">
                    Branch-wise Hardware Report
                </h2>

                <div class="report-info" id="reportInfo">
                    Loading...
                </div>

            </div>

        </div>


        <div class="table-wrap">

            <table id="reportTable">

                <thead id="tableHead">
                </thead>

                <tbody id="tableBody">
                </tbody>

            </table>

        </div>

    </div>

</main>


<script>

/* ================= API ================= */

var API_URL =
"https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec";


/* ================= DATA ================= */

var branchData = [];
var hardwareData = [];
var currentData = [];
var currentReport = "branch";


/* ================= ACTIVE SIDEBAR ================= */

document.addEventListener("DOMContentLoaded",function(){

    var currentPage =
        window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();

    if(!currentPage){
        currentPage="index.html";
    }

    document.querySelectorAll(".menu a").forEach(function(link){

        var linkPage =
            link.getAttribute("href")
            .split("/")
            .pop()
            .toLowerCase();

        if(linkPage===currentPage){
            link.classList.add("active");
        }

    });

    loadReports();

});


/* ================= LOAD REPORTS ================= */

function loadReports(){

    Promise.all([

        fetch(API_URL+"?action=branchSummary")
            .then(function(r){
                return r.json();
            }),

        fetch(API_URL+"?action=hardwareSummary")
            .then(function(r){
                return r.json();
            })

    ])
    .then(function(results){

        var branchResponse = results[0];
        var hardwareResponse = results[1];


        branchData =
            branchResponse.data ||
            branchResponse.branches ||
            [];


        hardwareData =
            hardwareResponse.data ||
            hardwareResponse.hardware ||
            [];


        calculateTotals();

        renderReport();

    })
    .catch(function(error){

        console.error(error);

        document.getElementById("tableBody").innerHTML =
            '<tr><td colspan="10" class="empty">Unable to load report data.</td></tr>';

        document.getElementById("reportInfo").innerText =
            "Error loading report.";

    });

}


/* ================= CALCULATE TOTALS ================= */

function calculateTotals(){

    var total = 0;
    var working = 0;
    var notWorking = 0;
    var repair = 0;
    var damaged = 0;


    branchData.forEach(function(row){

        total += num(row.total);

        working += num(row.working);

        notWorking += num(
            row.notWorking !== undefined
            ? row.notWorking
            : row.notworking
        );

        repair += num(
            row.underRepair !== undefined
            ? row.underRepair
            : row.repair
        );

        damaged += num(row.damaged);

    });


    document.getElementById("total").innerText =
        total.toLocaleString("en-IN");

    document.getElementById("working").innerText =
        working.toLocaleString("en-IN");

    document.getElementById("notWorking").innerText =
        notWorking.toLocaleString("en-IN");

    document.getElementById("repair").innerText =
        repair.toLocaleString("en-IN");

    document.getElementById("damaged").innerText =
        damaged.toLocaleString("en-IN");

}


/* ================= CHANGE REPORT ================= */

function changeReport(){

    currentReport =
        document.getElementById("reportType").value;

    document.getElementById("search").value = "";

    renderReport();

}


/* ================= RENDER REPORT ================= */

function renderReport(){

    var search =
        document.getElementById("search").value
        .toLowerCase()
        .trim();


    if(currentReport==="branch"){

        document.getElementById("reportTitle").innerText =
            "Branch-wise Hardware Report";

        document.getElementById("reportInfo").innerText =
            "Branch-wise hardware inventory summary";

        renderBranchReport(search);

    }
    else{

        document.getElementById("reportTitle").innerText =
            "Hardware-wise Report";

        document.getElementById("reportInfo").innerText =
            "Hardware type-wise inventory summary";

        renderHardwareReport(search);

    }

}


/* ================= BRANCH REPORT ================= */

function renderBranchReport(search){

    var data =
        branchData.filter(function(row){

            var text =
                String(row.solId || "") + " " +
                String(row.branchName || "");

            return text
                .toLowerCase()
                .indexOf(search) !== -1;

        });


    currentData = data;


    document.getElementById("tableHead").innerHTML =

        "<tr>" +

        "<th>S.No</th>" +
        "<th>SOL ID</th>" +
        "<th>Branch Name</th>" +
        "<th>Total</th>" +
        "<th>Working</th>" +
        "<th>Not Working</th>" +
        "<th>Under Repair</th>" +
        "<th>Damaged</th>" +
        "<th>Working %</th>" +

        "</tr>";


    var html = "";


    if(data.length===0){

        html =
            '<tr><td colspan="9" class="empty">No records found.</td></tr>';

    }
    else{

        data.forEach(function(row,index){

            var total = num(row.total);

            var working = num(row.working);

            var notWorking = num(
                row.notWorking !== undefined
                ? row.notWorking
                : row.notworking
            );

            var repair = num(
                row.underRepair !== undefined
                ? row.underRepair
                : row.repair
            );

            var damaged = num(row.damaged);


            var percentage =
                total > 0
                ? ((working/total)*100).toFixed(1)
                : "0.0";


            html +=

                "<tr>" +

                "<td>"+(index+1)+"</td>" +

                "<td>"+safe(row.solId)+"</td>" +

                "<td>"+safe(row.branchName)+"</td>" +

                "<td class='text-center'>"+
                    total+
                "</td>" +

                "<td class='text-center'>"+
                    '<span class="badge badge-working">'+
                    working+
                    '</span>'+
                "</td>" +

                "<td class='text-center'>"+
                    '<span class="badge badge-not">'+
                    notWorking+
                    '</span>'+
                "</td>" +

                "<td class='text-center'>"+
                    '<span class="badge badge-repair">'+
                    repair+
                    '</span>'+
                "</td>" +

                "<td class='text-center'>"+
                    '<span class="badge badge-damaged">'+
                    damaged+
                    '</span>'+
                "</td>" +

                "<td class='text-center'>"+
                    percentage+"%"+
                "</td>" +

                "</tr>";

        });

    }


    document.getElementById("tableBody").innerHTML =
        html;

}


/* ================= HARDWARE REPORT ================= */

function renderHardwareReport(search){

    var data =
        hardwareData.filter(function(row){

            var text =
                String(row.hardwareType || row.type || "");

            return text
                .toLowerCase()
                .indexOf(search) !== -1;

        });


    currentData = data;


    document.getElementById("tableHead").innerHTML =

        "<tr>" +

        "<th>S.No</th>" +
        "<th>Hardware Type</th>" +
        "<th>Total</th>" +
        "<th>Working</th>" +
        "<th>Not Working</th>" +
        "<th>Under Repair</th>" +
        "<th>Damaged</th>" +
        "<th>Working %</th>" +

        "</tr>";


    var html = "";


    if(data.length===0){

        html =
            '<tr><td colspan="8" class="empty">No records found.</td></tr>';

    }
    else{

        data.forEach(function(row,index){

            var type =
                row.hardwareType ||
                row.type ||
                "";

            var total =
                num(row.total);

            var working =
                num(row.working);

            var notWorking =
                num(
                    row.notWorking !== undefined
                    ? row.notWorking
                    : row.notworking
                );

            var repair =
                num(
                    row.underRepair !== undefined
                    ? row.underRepair
                    : row.repair
                );

            var damaged =
                num(row.damaged);


            var percentage =
                total > 0
                ? ((working/total)*100).toFixed(1)
                : "0.0";


            html +=

                "<tr>" +

                "<td>"+(index+1)+"</td>" +

                "<td><b>"+
                    safe(type)+
                "</b></td>" +

                "<td class='text-center'>"+
                    total+
                "</td>" +

                "<td class='text-center'>"+
                    '<span class="badge badge-working">'+
                    working+
                    '</span>'+
                "</td>" +

                "<td class='text-center'>"+
                    '<span class="badge badge-not">'+
                    notWorking+
                    '</span>'+
                "</td>" +

                "<td class='text-center'>"+
                    '<span class="badge badge-repair">'+
                    repair+
                    '</span>'+
                "</td>" +

                "<td class='text-center'>"+
                    '<span class="badge badge-damaged">'+
                    damaged+
                    '</span>'+
                "</td>" +

                "<td class='text-center'>"+
                    percentage+"%"+
                "</td>" +

                "</tr>";

        });

    }


    document.getElementById("tableBody").innerHTML =
        html;

}


/* ================= SEARCH ================= */

function applyFilter(){

    renderReport();

}


/* ================= EXPORT CSV ================= */

function exportCSV(){

    if(!currentData || currentData.length===0){

        alert("No data available for export.");

        return;

    }


    var csv = "";


    if(currentReport==="branch"){

        csv +=
            "S.No,SOL ID,Branch Name,Total,Working,Not Working,Under Repair,Damaged,Working %\n";


        currentData.forEach(function(row,index){

            var total = num(row.total);

            var working = num(row.working);

            var notWorking = num(
                row.notWorking !== undefined
                ? row.notWorking
                : row.notworking
            );

            var repair = num(
                row.underRepair !== undefined
                ? row.underRepair
                : row.repair
            );

            var damaged = num(row.damaged);

            var percentage =
                total > 0
                ? ((working/total)*100).toFixed(1)
                : "0.0";


            csv +=

                (index+1)+"," +
                csvValue(row.solId)+"," +
                csvValue(row.branchName)+"," +
                total+"," +
                working+"," +
                notWorking+"," +
                repair+"," +
                damaged+"," +
                percentage+"%\n";

        });

    }
    else{

        csv +=
            "S.No,Hardware Type,Total,Working,Not Working,Under Repair,Damaged,Working %\n";


        currentData.forEach(function(row,index){

            var type =
                row.hardwareType ||
                row.type ||
                "";

            var total = num(row.total);

            var working = num(row.working);

            var notWorking = num(
                row.notWorking !== undefined
                ? row.notWorking
                : row.notworking
            );

            var repair = num(
                row.underRepair !== undefined
                ? row.underRepair
                : row.repair
            );

            var damaged = num(row.damaged);

            var percentage =
                total > 0
                ? ((working/total)*100).toFixed(1)
                : "0.0";


            csv +=

                (index+1)+"," +
                csvValue(type)+"," +
                total+"," +
                working+"," +
                notWorking+"," +
                repair+"," +
                damaged+"," +
                percentage+"%\n";

        });

    }


    var blob =
        new Blob(
            [csv],
            {type:"text/csv;charset=utf-8;"}
        );


    var url =
        URL.createObjectURL(blob);


    var link =
        document.createElement("a");


    link.href = url;

    link.download =
        currentReport==="branch"
        ? "MPGB_Branch_Wise_Report.csv"
        : "MPGB_Hardware_Wise_Report.csv";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


/* ================= HELPERS ================= */

function num(value){

    var n =
        parseInt(value,10);

    return isNaN(n) ? 0 : n;

}


function safe(value){

    if(value===undefined || value===null){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function csvValue(value){

    if(value===undefined || value===null){
        return '""';
    }

    return '"' +
        String(value)
        .replace(/"/g,'""') +
        '"';

}

</script>

</body>
</html>
