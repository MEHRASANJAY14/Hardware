<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Hardware - MPGB</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7f6;
    color:#222;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:245px;
    height:100vh;
    background:#006400;
    color:#fff;
    padding:22px 14px;
    z-index:1000;
    box-shadow:3px 0 12px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:28px;
}

.logo small{
    display:block;
    font-size:11px;
    font-weight:normal;
    margin-top:5px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    text-decoration:none;
    padding:13px 14px;
    border-radius:9px;
    margin:5px 0;
    font-size:14px;
    transition:.2s;
}

.menu a:hover{
    background:#00823b;
}

.menu a.active{
    background:#00823b;
    box-shadow:inset 4px 0 #fff;
}

.menu i{
    width:22px;
    text-align:center;
    font-style:normal;
    font-size:18px;
}

/* ================= MAIN ================= */

.main{
    margin-left:245px;
    padding:25px;
}

.header{
    background:#fff;
    border-radius:14px;
    padding:22px;
    margin-bottom:22px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.header h1{
    color:#006400;
    font-size:27px;
}

.header p{
    color:#666;
    margin-top:7px;
}

/* ================= FORM ================= */

.form-card{
    background:#fff;
    border-radius:14px;
    padding:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
    max-width:1100px;
}

.form-title{
    color:#006400;
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1 / -1;
}

label{
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
    color:#444;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #d4dcd7;
    border-radius:8px;
    padding:11px 12px;
    font-size:14px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#00823b;
    box-shadow:0 0 0 2px rgba(0,130,59,.08);
}

textarea{
    min-height:90px;
    resize:vertical;
}

.required{
    color:#d00000;
}

.branch-info{
    margin-top:7px;
    font-size:12px;
    color:#00823b;
    font-weight:bold;
}

/* ================= BUTTON ================= */

.buttons{
    display:flex;
    gap:12px;
    margin-top:24px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 25px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.btn-save{
    background:#006400;
    color:white;
}

.btn-save:hover{
    background:#00823b;
}

.btn-reset{
    background:#e9eeeb;
    color:#333;
}

.btn-reset:hover{
    background:#dce4df;
}

/* ================= MESSAGE ================= */

.message{
    display:none;
    margin-bottom:18px;
    padding:13px 15px;
    border-radius:8px;
    font-size:14px;
}

.message.success{
    display:block;
    background:#e6f7ec;
    color:#08752d;
    border:1px solid #a9dfba;
}

.message.error{
    display:block;
    background:#ffe8e8;
    color:#b00020;
    border:1px solid #f0b5b5;
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

    .sidebar{
        width:70px;
        padding:15px 8px;
    }

    .logo{
        font-size:0;
    }

    .logo:before{
        content:"MP";
        font-size:20px;
    }

    .logo small,
    .menu span{
        display:none;
    }

    .menu a{
        justify-content:center;
        padding:12px;
    }

    .main{
        margin-left:70px;
        padding:15px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

}

@media(max-width:500px){

    .main{
        padding:10px;
    }

    .form-card{
        padding:17px;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }

}

</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        MPGB
        <small>Hardware Management</small>
    </div>

    <nav class="menu">

        <a href="index.html">
            <i>⌂</i>
            <span>Dashboard</span>
        </a>

        <a href="add-hardware.html">
            <i>＋</i>
            <span>Add Hardware</span>
        </a>

        <a href="records.html">
            <i>▣</i>
            <span>Hardware Records</span>
        </a>

        <a href="edit-hardware.html">
            <i>✎</i>
            <span>Edit / Update</span>
        </a>

        <a href="branch-summary.html">
            <i>▥</i>
            <span>Branch Summary</span>
        </a>

        <a href="hardware-summary.html">
            <i>◈</i>
            <span>Hardware Summary</span>
        </a>

        <a href="reports.html">
            <i>▤</i>
            <span>Reports</span>
        </a>

    </nav>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <div class="header">

        <h1>Add Hardware</h1>

        <p>
            MPGB • Regional Office Jabalpur • Hardware Inventory
        </p>

    </div>


    <div id="message" class="message"></div>


    <div class="form-card">

        <div class="form-title">
            Hardware Registration
        </div>


        <form id="hardwareForm">

            <div class="form-grid">

                <!-- SOL -->

                <div class="field">

                    <label>
                        SOL ID <span class="required">*</span>
                    </label>

                    <select id="solId" name="solId" required>

                        <option value="">
                            Loading branches...
                        </option>

                    </select>

                    <div id="branchInfo" class="branch-info"></div>

                </div>


                <!-- HARDWARE TYPE -->

                <div class="field">

                    <label>
                        Hardware Type <span class="required">*</span>
                    </label>

                    <select id="hardwareType"
                            name="hardwareType"
                            required>

                        <option value="">
                            Select Hardware Type
                        </option>

                        <option value="CPU">
                            CPU
                        </option>

                        <option value="Monitor">
                            Monitor
                        </option>

                        <option value="Passbook Printer">
                            Passbook Printer
                        </option>

                        <option value="Laser Printer">
                            Laser Printer
                        </option>

                        <option value="Scanner">
                            Scanner
                        </option>

                        <option value="CTS Machine">
                            CTS Machine
                        </option>

                        <option value="CCTV Monitor">
                            CCTV Monitor
                        </option>

                        <option value="Biometric Device">
                            Biometric Device
                        </option>

                        <option value="UPS">
                            UPS
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- SUB TYPE -->

                <div class="field">

                    <label>
                        Hardware Sub Type
                    </label>

                    <input
                        type="text"
                        id="hardwareSubType"
                        name="hardwareSubType"
                        placeholder="Enter sub type"
                    >

                </div>


                <!-- MAKE -->

                <div class="field">

                    <label>
                        Make
                    </label>

                    <input
                        type="text"
                        id="make"
                        name="make"
                        placeholder="HP / Dell / Canon / Epson etc."
                    >

                </div>


                <!-- MODEL -->

                <div class="field">

                    <label>
                        Model
                    </label>

                    <input
                        type="text"
                        id="model"
                        name="model"
                        placeholder="Enter model number"
                    >

                </div>


                <!-- SERIAL -->

                <div class="field">

                    <label>
                        Serial No.
                    </label>

                    <input
                        type="text"
                        id="serialNo"
                        name="serialNo"
                        placeholder="Enter serial number"
                    >

                </div>


                <!-- CONDITION -->

                <div class="field">

                    <label>
                        Condition <span class="required">*</span>
                    </label>

                    <select id="condition"
                            name="condition"
                            required>

                        <option value="">
                            Select Condition
                        </option>

                        <option value="WORKING">
                            WORKING
                        </option>

                        <option value="NOT WORKING">
                            NOT WORKING
                        </option>

                        <option value="UNDER REPAIR">
                            UNDER REPAIR
                        </option>

                        <option value="DAMAGED">
                            DAMAGED
                        </option>

                    </select>

                </div>


                <!-- REMARKS -->

                <div class="field full">

                    <label>
                        Remarks
                    </label>

                    <textarea
                        id="remarks"
                        name="remarks"
                        placeholder="Enter remarks if any..."
                    ></textarea>

                </div>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="btn-save"
                    id="saveBtn">

                    Save Hardware

                </button>

                <button
                    type="reset"
                    class="btn-reset">

                    Reset

                </button>

            </div>

        </form>

    </div>

</main>


<script>

/* =====================================================
   API
===================================================== */

var API_URL =
"https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec";


/* =====================================================
   ACTIVE SIDEBAR
===================================================== */

document.addEventListener("DOMContentLoaded",function(){

    var currentPage =
        window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();

    if(!currentPage){
        currentPage="index.html";
    }

    document.querySelectorAll(".menu a").forEach(function(link){

        var linkPage =
            link.getAttribute("href")
            .split("/")
            .pop()
            .toLowerCase();

        if(linkPage===currentPage){
            link.classList.add("active");
        }

    });

    loadBranches();

});


/* =====================================================
   LOAD BRANCHES
===================================================== */

function loadBranches(){

    var select =
        document.getElementById("solId");

    fetch(API_URL+"?action=getSOLList")

    .then(function(response){

        if(!response.ok){
            throw new Error("Unable to connect to server");
        }

        return response.json();

    })

    .then(function(result){

        if(result.status==="error"){

            throw new Error(
                result.message || "Unable to load branches"
            );

        }

        var branches =
            result.data ||
            result.branches ||
            [];

        select.innerHTML =
            '<option value="">Select SOL / Branch</option>';


        branches.forEach(function(branch){

            var option =
                document.createElement("option");

            option.value =
                branch.solId;

            option.textContent =
                branch.solId +
                " - " +
                branch.branchName;

            option.setAttribute(
                "data-branch",
                branch.branchName
            );

            select.appendChild(option);

        });

    })

    .catch(function(error){

        console.error(error);

        select.innerHTML =
            '<option value="">Unable to load branches</option>';

        showMessage(
            "Unable to load SOL / Branch list. Please refresh the page.",
            "error"
        );

    });

}


/* =====================================================
   BRANCH NAME
===================================================== */

document.getElementById("solId")
.addEventListener("change",function(){

    var option =
        this.options[this.selectedIndex];

    var branch =
        option.getAttribute("data-branch");

    document.getElementById("branchInfo").innerText =
        branch ? "Branch: " + branch : "";

});


/* =====================================================
   SAVE
===================================================== */

document.getElementById("hardwareForm")
.addEventListener("submit",function(e){

    e.preventDefault();

    var btn =
        document.getElementById("saveBtn");

    btn.disabled=true;

    btn.innerText="Saving...";


    var formData =
        new FormData(this);


    var params =
        new URLSearchParams();

    params.append(
        "action",
        "save"
    );


    formData.forEach(function(value,key){

        params.append(
            key,
            value
        );

    });


    fetch(API_URL,{
        method:"POST",
        body:params
    })

    .then(function(response){

        if(!response.ok){
            throw new Error("Server error");
        }

        return response.json();

    })

    .then(function(result){

        if(
            result.status==="success" ||
            result.success===true
        ){

            showMessage(
                result.message ||
                "Hardware saved successfully.",
                "success"
            );

            document.getElementById(
                "hardwareForm"
            ).reset();

            document.getElementById(
                "branchInfo"
            ).innerText="";

        }else{

            throw new Error(
                result.message ||
                "Unable to save hardware."
            );

        }

    })

    .catch(function(error){

        console.error(error);

        showMessage(
            error.message ||
            "Unable to save hardware.",
            "error"
        );

    })

    .finally(function(){

        btn.disabled=false;

        btn.innerText="Save Hardware";

    });

});


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    var box =
        document.getElementById("message");

    box.className =
        "message " + type;

    box.innerText =
        text;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

</script>

</body>
</html>
