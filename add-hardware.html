<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MPGB | Add Hardware</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#f3f7f4;
    color:#1f2937;
}

/* ================= MAIN ================= */

.main{
    margin-left:255px;
    min-height:100vh;
    padding:28px;
    transition:.3s;
}

/* ================= PAGE HEADER ================= */

.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
}

.page-title{
    display:flex;
    align-items:center;
    gap:14px;
}

.page-icon{
    width:52px;
    height:52px;
    border-radius:14px;
    background:linear-gradient(135deg,#006400,#00994d);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    box-shadow:0 8px 20px rgba(0,100,0,.18);
}

.page-title h1{
    font-size:25px;
    color:#064e24;
}

.page-title p{
    font-size:12px;
    color:#7b8794;
    margin-top:4px;
}

/* ================= TOP BADGE ================= */

.top-badge{
    background:#e5f6eb;
    color:#006400;
    padding:9px 14px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.top-badge span{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#16a34a;
    margin-right:6px;
}

/* ================= FORM CARD ================= */

.form-card{
    background:#fff;
    border-radius:18px;
    box-shadow:0 8px 30px rgba(0,0,0,.07);
    overflow:hidden;
    max-width:1100px;
}

/* ================= CARD HEADER ================= */

.card-header{
    padding:20px 25px;
    background:linear-gradient(
        135deg,
        #006400,
        #008c45
    );
    color:#fff;
}

.card-header h2{
    font-size:18px;
}

.card-header p{
    font-size:12px;
    opacity:.8;
    margin-top:4px;
}

/* ================= FORM ================= */

.form-body{
    padding:27px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:13px;
    font-weight:bold;
    color:#006400;
    margin-bottom:17px;
}

.section-title::before{
    content:"";
    width:4px;
    height:17px;
    border-radius:4px;
    background:#006400;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.form-group{
    position:relative;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:#374151;
    margin-bottom:7px;
}

.required{
    color:#dc2626;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #d7dee5;
    background:#fbfcfc;
    border-radius:9px;
    padding:12px 13px;
    font-size:13px;
    color:#222;
    outline:none;
    transition:.2s;
}

input:hover,
select:hover,
textarea:hover{
    border-color:#a9c7b3;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#008c45;
    background:#fff;
    box-shadow:
        0 0 0 3px rgba(0,140,69,.08);
}

textarea{
    height:90px;
    resize:vertical;
}

/* ================= SOL ================= */

.sol-wrapper{
    position:relative;
}

.sol-wrapper select{
    padding-right:40px;
}

.branch-display{
    min-height:18px;
    margin-top:7px;
    font-size:11px;
    color:#006400;
    font-weight:600;
}

.branch-display::before{
    content:"▸ ";
}

/* ================= SERIAL ================= */

.serial-hint{
    font-size:10px;
    color:#9ca3af;
    margin-top:5px;
}

/* ================= DIVIDER ================= */

.divider{
    height:1px;
    background:#edf0f2;
    margin:27px 0;
}

/* ================= BUTTONS ================= */

.action-area{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

.btn{
    border:none;
    padding:12px 22px;
    border-radius:9px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn-save{
    color:#fff;
    background:linear-gradient(
        135deg,
        #006400,
        #008c45
    );
    box-shadow:0 6px 15px rgba(0,100,0,.18);
}

.btn-save:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(0,100,0,.25);
}

.btn-reset{
    background:#eef1f2;
    color:#4b5563;
}

.btn-reset:hover{
    background:#e1e5e7;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ================= MESSAGE ================= */

.message{
    display:none;
    margin-bottom:20px;
    padding:13px 15px;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
}

.message.success{
    display:block;
    background:#e7f8ed;
    border:1px solid #b9e7c7;
    color:#08752d;
}

.message.error{
    display:block;
    background:#fff0f0;
    border:1px solid #f1c1c1;
    color:#a00000;
}

.message.loading{
    display:block;
    background:#edf5ff;
    border:1px solid #c9ddfa;
    color:#1d4f91;
}

/* ================= API STATUS ================= */

.api-footer{
    margin-top:16px;
    font-size:11px;
    color:#8b949e;
}

.api-dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#aaa;
    margin-right:5px;
}

.api-dot.online{
    background:#16a34a;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    .main{
        margin-left:75px;
        padding:18px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .page-header{
        align-items:flex-start;
    }

    .top-badge{
        display:none;
    }
}

@media(max-width:550px){

    .main{
        margin-left:70px;
        padding:12px;
    }

    .page-title h1{
        font-size:20px;
    }

    .page-icon{
        width:44px;
        height:44px;
    }

    .form-body{
        padding:18px;
    }

    .action-area{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }
}
</style>
</head>

<body>

<!--
    sidebar.js
    Same folder mein hona chahiye
-->
<script src="sidebar.js"></script>


<main class="main">

    <!-- ================= HEADER ================= -->

    <div class="page-header">

        <div class="page-title">

            <div class="page-icon">
                ＋
            </div>

            <div>
                <h1>Add Hardware</h1>

                <p>
                    Register new hardware in MPGB inventory
                </p>
            </div>

        </div>

        <div class="top-badge">
            <span></span>
            System Online
        </div>

    </div>


    <!-- ================= FORM CARD ================= -->

    <div class="form-card">

        <div class="card-header">

            <h2>Hardware Registration</h2>

            <p>
                Enter hardware details and save the inventory record
            </p>

        </div>


        <div class="form-body">


            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>


            <form id="hardwareForm">


                <!-- ================= LOCATION ================= -->

                <div class="section-title">
                    Branch Information
                </div>


                <div class="form-grid">

                    <div class="form-group">

                        <label>
                            SOL ID
                            <span class="required">*</span>
                        </label>

                        <div class="sol-wrapper">

                            <select
                                id="solId"
                                required>

                                <option value="">
                                    Loading SOL list...
                                </option>

                            </select>

                        </div>

                        <div
                            id="branchInfo"
                            class="branch-display">
                        </div>

                    </div>


                    <div class="form-group">

                        <label>
                            Hardware Type
                            <span class="required">*</span>
                        </label>

                        <select
                            id="hardwareType"
                            required>

                            <option value="">
                                Select Hardware Type
                            </option>

                            <option value="CPU">
                                CPU
                            </option>

                            <option value="Monitor">
                                Monitor
                            </option>

                            <option value="Passbook Printer">
                                Passbook Printer
                            </option>

                            <option value="Laser Printer">
                                Laser Printer
                            </option>

                            <option value="Scanner">
                                Scanner
                            </option>

                            <option value="CTS Machine">
                                CTS Machine
                            </option>

                            <option value="CCTV Monitor">
                                CCTV Monitor
                            </option>

                            <option value="Biometric Device">
                                Biometric Device
                            </option>

                            <option value="UPS">
                                UPS
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <div class="divider"></div>


                <!-- ================= HARDWARE ================= -->

                <div class="section-title">
                    Hardware Details
                </div>


                <div class="form-grid">


                    <!-- MAKE -->

                    <div class="form-group">

                        <label>
                            Make
                        </label>

                        <input
                            type="text"
                            id="make"
                            placeholder="e.g. HP, Dell, Canon">

                    </div>


                    <!-- MODEL -->

                    <div class="form-group">

                        <label>
                            Model
                        </label>

                        <input
                            type="text"
                            id="model"
                            placeholder="Enter model number">

                    </div>


                    <!-- SERIAL -->

                    <div class="form-group">

                        <label>
                            Serial Number
                        </label>

                        <input
                            type="text"
                            id="serialNo"
                            placeholder="Enter serial number">

                        <div class="serial-hint">
                            Enter the exact serial number printed on the device
                        </div>

                    </div>


                    <!-- CONDITION -->

                    <div class="form-group">

                        <label>
                            Condition
                            <span class="required">*</span>
                        </label>

                        <select
                            id="condition"
                            required>

                            <option value="">
                                Select Condition
                            </option>

                            <option value="WORKING">
                                WORKING
                            </option>

                            <option value="NOT WORKING">
                                NOT WORKING
                            </option>

                            <option value="UNDER REPAIR">
                                UNDER REPAIR
                            </option>

                            <option value="DAMAGED">
                                DAMAGED
                            </option>

                        </select>

                    </div>


                    <!-- REMARKS -->

                    <div class="form-group full">

                        <label>
                            Remarks
                        </label>

                        <textarea
                            id="remarks"
                            placeholder="Enter additional remarks, if any">
                        </textarea>

                    </div>

                </div>


                <div class="divider"></div>


                <!-- ================= ACTION ================= -->

                <div class="action-area">

                    <button
                        type="button"
                        class="btn btn-reset"
                        onclick="resetForm()">

                        Reset

                    </button>


                    <button
                        type="submit"
                        id="saveBtn"
                        class="btn btn-save">

                        Save Hardware

                    </button>

                </div>


            </form>


            <!-- API STATUS -->

            <div class="api-footer">

                <span
                    id="apiDot"
                    class="api-dot">
                </span>

                API:
                <span id="apiStatus">
                    Checking connection...
                </span>

            </div>

        </div>

    </div>

</main>


<script>

/* =========================================================
   API
========================================================= */

var API_URL =
"https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec";


var branchList = [];


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        checkAPI();

        loadSOLList();

    }
);


/* =========================================================
   API CHECK
========================================================= */

function checkAPI(){

    fetch(
        API_URL +
        "?action=getSOLList&t=" +
        Date.now()
    )

    .then(function(response){

        return response.json();

    })

    .then(function(result){

        if(
            result.success === true ||
            result.status === "success"
        ){

            document.getElementById(
                "apiStatus"
            ).innerText =
                "Connected";

            document.getElementById(
                "apiDot"
            ).classList.add(
                "online"
            );

        }
        else{

            throw new Error(
                "API Error"
            );

        }

    })

    .catch(function(){

        document.getElementById(
            "apiStatus"
        ).innerText =
            "Connection Error";

    });

}


/* =========================================================
   LOAD SOL
========================================================= */

function loadSOLList(){

    showMessage(
        "Loading branch list...",
        "loading"
    );


    fetch(
        API_URL +
        "?action=getSOLList&t=" +
        Date.now()
    )

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        return response.json();

    })

    .then(function(result){

        if(
            result.success !== true &&
            result.status !== "success"
        ){

            throw new Error(
                result.message ||
                "Unable to load SOL list"
            );

        }


        branchList =
            Array.isArray(result.data)
            ? result.data
            : [];


        populateSOL();

        hideMessage();

    })

    .catch(function(error){

        showMessage(
            "Unable to load SOL list: " +
            error.message,
            "error"
        );

    });

}


/* =========================================================
   POPULATE SOL
========================================================= */

function populateSOL(){

    var select =
        document.getElementById(
            "solId"
        );


    select.innerHTML =
        '<option value="">Select SOL ID</option>';


    branchList.forEach(
        function(branch){

            var sol =
                normalizeSol(
                    branch.solId
                );


            var option =
                document.createElement(
                    "option"
                );


            option.value =
                sol;


            option.textContent =
                sol +
                " - " +
                branch.branchName;


            option.setAttribute(
                "data-branch",
                branch.branchName
            );


            select.appendChild(
                option
            );

        }
    );


    if(
        branchList.length === 0
    ){

        select.innerHTML =
            '<option value="">No SOL available</option>';

    }

}


/* =========================================================
   SOL CHANGE
========================================================= */

document
.getElementById("solId")
.addEventListener(
    "change",
    function(){

        var sol =
            normalizeSol(
                this.value
            );


        var branch =
            branchList.find(
                function(item){

                    return normalizeSol(
                        item.solId
                    ) === sol;

                }
            );


        var info =
            document.getElementById(
                "branchInfo"
            );


        if(branch){

            info.innerText =
                "Branch: " +
                branch.branchName;

        }
        else{

            info.innerText =
                "";

        }

    }
);


/* =========================================================
   SAVE
========================================================= */

document
.getElementById("hardwareForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        saveHardware();

    }
);


function saveHardware(){

    var solId =
        normalizeSol(
            document.getElementById(
                "solId"
            ).value
        );


    var hardwareType =
        document.getElementById(
            "hardwareType"
        ).value.trim();


    var make =
        document.getElementById(
            "make"
        ).value.trim();


    var model =
        document.getElementById(
            "model"
        ).value.trim();


    var serialNo =
        document.getElementById(
            "serialNo"
        ).value.trim();


    var condition =
        document.getElementById(
            "condition"
        ).value.trim();


    var remarks =
        document.getElementById(
            "remarks"
        ).value.trim();


    /* ================= VALIDATION ================= */

    if(!solId){

        showMessage(
            "Please select SOL ID.",
            "error"
        );

        return;

    }


    if(!hardwareType){

        showMessage(
            "Please select Hardware Type.",
            "error"
        );

        return;

    }


    if(!condition){

        showMessage(
            "Please select hardware condition.",
            "error"
        );

        return;

    }


    var branch =
        branchList.find(
            function(item){

                return normalizeSol(
                    item.solId
                ) === solId;

            }
        );


    if(!branch){

        showMessage(
            "Invalid SOL ID. Please select SOL from the dropdown.",
            "error"
        );

        return;

    }


    /* ================= DATA ================= */

    var data = {

        action:"save",

        solId:solId,

        hardwareType:
            hardwareType,

        make:make,

        model:model,

        serialNo:serialNo,

        condition:condition,

        remarks:remarks

    };


    var button =
        document.getElementById(
            "saveBtn"
        );


    button.disabled = true;

    button.innerText =
        "Saving...";


    showMessage(
        "Saving hardware record...",
        "loading"
    );


    fetch(
        API_URL,
        {

            method:"POST",

            headers:{
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(data)

        }
    )

    .then(function(response){

        return response.json();

    })

    .then(function(result){

        console.log(
            "SAVE RESULT:",
            result
        );


        if(
            result.success === true ||
            result.status === "success"
        ){

            var msg =
                "Hardware saved successfully.";


            if(
                result.submissionId
            ){

                msg +=
                    " Submission ID: " +
                    result.submissionId;

            }


            showMessage(
                msg,
                "success"
            );


            /* Clear hardware fields */

            document.getElementById(
                "hardwareType"
            ).value = "";


            document.getElementById(
                "make"
            ).value = "";


            document.getElementById(
                "model"
            ).value = "";


            document.getElementById(
                "serialNo"
            ).value = "";


            document.getElementById(
                "condition"
            ).value = "";


            document.getElementById(
                "remarks"
            ).value = "";


            /*
             * SOL remains selected so
             * multiple hardware can be
             * entered for same branch.
             */

        }
        else{

            showMessage(
                result.message ||
                "Unable to save hardware.",
                "error"
            );

        }

    })

    .catch(function(error){

        console.error(
            error
        );


        showMessage(
            "Unable to save hardware: " +
            error.message,
            "error"
        );

    })

    .finally(function(){

        button.disabled =
            false;

        button.innerText =
            "Save Hardware";

    });

}


/* =========================================================
   RESET
========================================================= */

function resetForm(){

    document
    .getElementById(
        "hardwareForm"
    )
    .reset();


    document
    .getElementById(
        "branchInfo"
    )
    .innerText = "";


    hideMessage();

}


/* =========================================================
   NORMALIZE SOL
========================================================= */

function normalizeSol(value){

    var text =
        String(value || "")
        .replace(
            /\u00A0/g,
            " "
        )
        .trim();


    var match =
        text.match(
            /\b\d{5}\b/
        );


    if(match){

        return match[0];

    }


    return text.replace(
        /\s+/g,
        ""
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
){

    var box =
        document.getElementById(
            "message"
        );


    box.className =
        "message " +
        type;


    box.innerText =
        text;


    box.style.display =
        "block";

}


function hideMessage(){

    document.getElementById(
        "message"
    ).style.display =
        "none";

}

</script>

</body>
</html>
