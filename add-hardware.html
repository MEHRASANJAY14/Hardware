<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MPGB - Add Hardware</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f5;
    color:#222;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:245px;
    height:100vh;
    background:#006400;
    color:#fff;
    padding:22px 14px;
    z-index:1000;
    box-shadow:3px 0 12px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:28px;
}

.logo small{
    display:block;
    font-size:11px;
    font-weight:normal;
    margin-top:5px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    text-decoration:none;
    padding:13px 14px;
    border-radius:9px;
    margin:5px 0;
    font-size:14px;
    transition:.2s;
}

.menu a:hover{
    background:#00823b;
}

.menu a.active{
    background:#00823b;
    box-shadow:inset 4px 0 #fff;
}

.menu i{
    width:22px;
    text-align:center;
    font-style:normal;
    font-size:18px;
}


/* ================= MAIN ================= */

.main{
    margin-left:245px;
    padding:25px;
}

.header{
    margin-bottom:20px;
}

.header h1{
    color:#006400;
    font-size:27px;
}

.header p{
    color:#777;
    margin-top:5px;
}


/* ================= CARD ================= */

.card{
    background:#fff;
    border-radius:14px;
    padding:25px;
    max-width:1050px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}


/* ================= MESSAGE ================= */

.message{
    display:none;
    padding:13px 15px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:14px;
}

.message.success{
    display:block;
    background:#dff5e4;
    color:#08752a;
    border:1px solid #b9e6c4;
}

.message.error{
    display:block;
    background:#ffe1e1;
    color:#a00000;
    border:1px solid #f2bcbc;
}

.message.loading{
    display:block;
    background:#eef5ff;
    color:#1c4fa3;
}


/* ================= FORM ================= */

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#444;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:12px 13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:14px;
    background:#fff;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#006400;
    box-shadow:0 0 0 2px rgba(0,100,0,.08);
}

textarea{
    height:95px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}


/* ================= SOL ================= */

.sol-loading{
    color:#777;
}

.branch-info{
    margin-top:7px;
    font-size:12px;
    font-weight:bold;
    color:#006400;
    min-height:15px;
}


/* ================= BUTTONS ================= */

.button-row{
    display:flex;
    gap:10px;
    margin-top:5px;
}

button{
    border:0;
    border-radius:7px;
    padding:12px 22px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
}

.btn-save{
    background:#006400;
    color:#fff;
}

.btn-save:hover{
    background:#00823b;
}

.btn-reset{
    background:#777;
    color:#fff;
}

.btn-reset:hover{
    background:#555;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* ================= STATUS ================= */

.api-status{
    margin-top:18px;
    font-size:12px;
    color:#777;
}

.api-status span{
    font-weight:bold;
}


/* ================= MOBILE ================= */

@media(max-width:800px){

    .sidebar{
        width:70px;
        padding:15px 8px;
    }

    .logo{
        font-size:0;
    }

    .logo:before{
        content:"MP";
        font-size:20px;
    }

    .logo small,
    .menu span{
        display:none;
    }

    .menu a{
        justify-content:center;
        padding:12px;
    }

    .main{
        margin-left:70px;
        padding:15px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

}

@media(max-width:500px){

    .main{
        padding:10px;
    }

    .card{
        padding:16px;
    }

    .button-row{
        flex-direction:column;
    }

    button{
        width:100%;
    }

}

</style>
</head>


<body>


<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        MPGB
        <small>Hardware Management</small>
    </div>

    <nav class="menu">

        <a href="index.html">
            <i>⌂</i>
            <span>Dashboard</span>
        </a>

        <a href="add-hardware.html">
            <i>＋</i>
            <span>Add Hardware</span>
        </a>

        <a href="records.html">
            <i>▣</i>
            <span>Hardware Records</span>
        </a>

        <a href="edit-hardware.html">
            <i>✎</i>
            <span>Edit / Update</span>
        </a>

        <a href="branch-summary.html">
            <i>▥</i>
            <span>Branch Summary</span>
        </a>

        <a href="hardware-summary.html">
            <i>◈</i>
            <span>Hardware Summary</span>
        </a>

        <a href="reports.html">
            <i>▤</i>
            <span>Reports</span>
        </a>

    </nav>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">


    <div class="header">

        <h1>Add Hardware</h1>

        <p>
            MPGB Hardware Inventory Management
        </p>

    </div>


    <div class="card">


        <!-- MESSAGE -->

        <div
            id="message"
            class="message">
        </div>


        <!-- FORM -->

        <form id="hardwareForm">


            <div class="form-grid">


                <!-- SOL ID -->

                <div class="form-group">

                    <label>
                        SOL ID *
                    </label>

                    <select
                        id="solId"
                        required>

                        <option value="">
                            Loading SOL list...
                        </option>

                    </select>

                    <div
                        id="branchInfo"
                        class="branch-info">
                    </div>

                </div>


                <!-- HARDWARE TYPE -->

                <div class="form-group">

                    <label>
                        Hardware Type *
                    </label>

                    <select
                        id="hardwareType"
                        required>

                        <option value="">
                            Select Hardware Type
                        </option>

                        <option value="CPU">
                            CPU
                        </option>

                        <option value="Monitor">
                            Monitor
                        </option>

                        <option value="Passbook Printer">
                            Passbook Printer
                        </option>

                        <option value="Laser Printer">
                            Laser Printer
                        </option>

                        <option value="Scanner">
                            Scanner
                        </option>

                        <option value="CTS Machine">
                            CTS Machine
                        </option>

                        <option value="CCTV Monitor">
                            CCTV Monitor
                        </option>

                        <option value="Biometric Device">
                            Biometric Device
                        </option>

                        <option value="UPS">
                            UPS
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- SUB TYPE -->

                <div class="form-group">

                    <label>
                        Hardware Sub Type
                    </label>

                    <input
                        type="text"
                        id="hardwareSubType"
                        placeholder="Enter hardware sub type">

                </div>


                <!-- MAKE -->

                <div class="form-group">

                    <label>
                        Make
                    </label>

                    <input
                        type="text"
                        id="make"
                        placeholder="HP / Dell / Canon etc.">

                </div>


                <!-- MODEL -->

                <div class="form-group">

                    <label>
                        Model
                    </label>

                    <input
                        type="text"
                        id="model"
                        placeholder="Enter model">

                </div>


                <!-- SERIAL -->

                <div class="form-group">

                    <label>
                        Serial No.
                    </label>

                    <input
                        type="text"
                        id="serialNo"
                        placeholder="Enter serial number">

                </div>


                <!-- CONDITION -->

                <div class="form-group">

                    <label>
                        Condition *
                    </label>

                    <select
                        id="condition"
                        required>

                        <option value="">
                            Select Condition
                        </option>

                        <option value="WORKING">
                            WORKING
                        </option>

                        <option value="NOT WORKING">
                            NOT WORKING
                        </option>

                        <option value="UNDER REPAIR">
                            UNDER REPAIR
                        </option>

                        <option value="DAMAGED">
                            DAMAGED
                        </option>

                    </select>

                </div>


                <!-- REMARKS -->

                <div class="form-group full">

                    <label>
                        Remarks
                    </label>

                    <textarea
                        id="remarks"
                        placeholder="Enter remarks">
                    </textarea>

                </div>


                <!-- BUTTONS -->

                <div class="form-group full">

                    <div class="button-row">

                        <button
                            type="submit"
                            id="saveBtn"
                            class="btn-save">

                            Save Hardware

                        </button>


                        <button
                            type="button"
                            class="btn-reset"
                            onclick="resetForm()">

                            Reset

                        </button>

                    </div>

                </div>


            </div>


        </form>


        <div class="api-status">

            API Status:
            <span id="apiStatus">
                Checking...
            </span>

        </div>


    </div>


</main>


<script>


/* =========================================================
   API URL
========================================================= */

var API_URL =
"https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec";


/* =========================================================
   GLOBAL DATA
========================================================= */

var branchList = [];


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        setActiveMenu();

        checkAPI();

        loadSOLList();

    }
);


/* =========================================================
   ACTIVE SIDEBAR
========================================================= */

function setActiveMenu(){

    var currentPage =
        window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();


    if(!currentPage){

        currentPage =
            "index.html";

    }


    document
        .querySelectorAll(".menu a")
        .forEach(function(link){

            var linkPage =
                link
                .getAttribute("href")
                .split("/")
                .pop()
                .toLowerCase();


            if(
                linkPage ===
                currentPage
            ){

                link.classList.add(
                    "active"
                );

            }

        });

}


/* =========================================================
   CHECK API
========================================================= */

function checkAPI(){

    fetch(
        API_URL,
        {
            method:"GET",
            cache:"no-store"
        }
    )

    .then(function(response){

        return response.json();

    })

    .then(function(result){

        if(
            result.success === true ||
            result.status === "success"
        ){

            document
                .getElementById("apiStatus")
                .innerText =
                "Connected";

        }
        else{

            document
                .getElementById("apiStatus")
                .innerText =
                "Error";

        }

    })

    .catch(function(){

        document
            .getElementById("apiStatus")
            .innerText =
            "Not Connected";

    });

}


/* =========================================================
   LOAD SOL LIST DYNAMICALLY
========================================================= */

function loadSOLList(){

    showMessage(
        "Loading SOL / Branch list...",
        "loading"
    );


    fetch(
        API_URL +
        "?action=getSOLList&t=" +
        new Date().getTime(),
        {
            method:"GET",
            cache:"no-store"
        }
    )

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "HTTP Error " +
                response.status
            );

        }

        return response.json();

    })

    .then(function(result){

        if(
            result.success !== true &&
            result.status !== "success"
        ){

            throw new Error(
                result.message ||
                "Unable to load SOL list"
            );

        }


        branchList =
            Array.isArray(result.data)
            ? result.data
            : [];


        populateSOL();


        hideMessage();

    })

    .catch(function(error){

        showMessage(
            "Unable to load SOL list: " +
            error.message,
            "error"
        );


        var select =
            document.getElementById(
                "solId"
            );


        select.innerHTML =
            '<option value="">Unable to load SOL list</option>';

    });

}


/* =========================================================
   POPULATE SOL DROPDOWN
========================================================= */

function populateSOL(){

    var select =
        document.getElementById(
            "solId"
        );


    select.innerHTML =
        '<option value="">Select SOL ID</option>';


    branchList.forEach(
        function(branch){

            var option =
                document.createElement(
                    "option"
                );


            option.value =
                normalizeSolId(
                    branch.solId
                );


            option.textContent =
                normalizeSolId(
                    branch.solId
                ) +
                " - " +
                branch.branchName;


            option.setAttribute(
                "data-branch",
                branch.branchName
            );


            select.appendChild(
                option
            );

        }
    );


    /*
     * If no branches returned
     */

    if(
        branchList.length === 0
    ){

        select.innerHTML =
            '<option value="">No SOL found</option>';

    }

}


/* =========================================================
   SOL CHANGE
========================================================= */

document
    .getElementById("solId")
    .addEventListener(
        "change",
        function(){

            showBranchName(
                this.value
            );

        }
    );


/* =========================================================
   SHOW BRANCH
========================================================= */

function showBranchName(solId){

    var branchInfo =
        document.getElementById(
            "branchInfo"
        );


    if(!solId){

        branchInfo.innerText =
            "";

        return;

    }


    var branch =
        branchList.find(
            function(item){

                return (
                    normalizeSolId(
                        item.solId
                    ) ===
                    normalizeSolId(
                        solId
                    )
                );

            }
        );


    if(branch){

        branchInfo.innerText =
            "Branch: " +
            branch.branchName;

    }
    else{

        branchInfo.innerText =
            "";

    }

}


/* =========================================================
   FORM SUBMIT
========================================================= */

document
    .getElementById("hardwareForm")
    .addEventListener(
        "submit",
        function(event){

            event.preventDefault();


            saveHardware();

        }
    );


/* =========================================================
   SAVE HARDWARE
========================================================= */

function saveHardware(){

    var solId =
        normalizeSolId(
            document
                .getElementById("solId")
                .value
        );


    var hardwareType =
        document
            .getElementById("hardwareType")
            .value
            .trim();


    var hardwareSubType =
        document
            .getElementById("hardwareSubType")
            .value
            .trim();


    var make =
        document
            .getElementById("make")
            .value
            .trim();


    var model =
        document
            .getElementById("model")
            .value
            .trim();


    var serialNo =
        document
            .getElementById("serialNo")
            .value
            .trim();


    var condition =
        document
            .getElementById("condition")
            .value
            .trim();


    var remarks =
        document
            .getElementById("remarks")
            .value
            .trim();


    /* CLIENT VALIDATION */

    if(!solId){

        showMessage(
            "Please select SOL ID.",
            "error"
        );

        return;

    }


    if(!hardwareType){

        showMessage(
            "Please select Hardware Type.",
            "error"
        );

        return;

    }


    if(!condition){

        showMessage(
            "Please select Condition.",
            "error"
        );

        return;

    }


    /*
     * Verify SOL exists in dynamic master
     */

    var branch =
        branchList.find(
            function(item){

                return (
                    normalizeSolId(
                        item.solId
                    ) === solId
                );

            }
        );


    if(!branch){

        showMessage(
            "Invalid SOL ID. Please select a valid SOL from the list.",
            "error"
        );

        return;

    }


    var data = {

        action:"save",

        solId:solId,

        hardwareType:
            hardwareType,

        hardwareSubType:
            hardwareSubType,

        make:make,

        model:model,

        serialNo:serialNo,

        condition:condition,

        remarks:remarks

    };


    var button =
        document.getElementById(
            "saveBtn"
        );


    button.disabled =
        true;

    button.innerText =
        "Saving...";


    showMessage(
        "Saving hardware...",
        "loading"
    );


    fetch(
        API_URL,
        {

            method:"POST",

            headers:{
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(data)

        }
    )

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "HTTP Error " +
                response.status
            );

        }

        return response.json();

    })

    .then(function(result){

        console.log(
            "SAVE RESPONSE:",
            result
        );


        if(
            result.success === true ||
            result.status === "success"
        ){

            showMessage(

                "Hardware saved successfully." +

                (
                    result.submissionId
                    ? " Submission ID: " +
                      result.submissionId
                    : ""
                ),

                "success"

            );


            /*
             * Reset only hardware fields.
             * SOL remains selected for faster
             * multiple entries of same branch.
             */

            document
                .getElementById(
                    "hardwareType"
                )
                .value = "";

            document
                .getElementById(
                    "hardwareSubType"
                )
                .value = "";

            document
                .getElementById(
                    "make"
                )
                .value = "";

            document
                .getElementById(
                    "model"
                )
                .value = "";

            document
                .getElementById(
                    "serialNo"
                )
                .value = "";

            document
                .getElementById(
                    "condition"
                )
                .value = "";

            document
                .getElementById(
                    "remarks"
                )
                .value = "";


            showBranchName(
                solId
            );

        }
        else{

            showMessage(

                result.message ||
                "Unable to save hardware.",

                "error"

            );

        }

    })

    .catch(function(error){

        console.error(
            "SAVE ERROR:",
            error
        );


        showMessage(

            "Unable to save hardware: " +
            error.message,

            "error"

        );

    })

    .finally(function(){

        button.disabled =
            false;

        button.innerText =
            "Save Hardware";

    });

}


/* =========================================================
   RESET FORM
========================================================= */

function resetForm(){

    document
        .getElementById(
            "hardwareForm"
        )
        .reset();


    document
        .getElementById(
            "branchInfo"
        )
        .innerText =
        "";


    hideMessage();

}


/* =========================================================
   NORMALIZE SOL
========================================================= */

function normalizeSolId(value){

    var text =
        String(value || "")
        .replace(
            /\u00A0/g,
            " "
        )
        .trim();


    /*
     * Extract 5 digit SOL if
     * "12010 - JABALPUR" is received.
     */

    var match =
        text.match(
            /\b\d{5}\b/
        );


    if(match){

        return match[0];

    }


    return text.replace(
        /\s+/g,
        ""
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
){

    var box =
        document.getElementById(
            "message"
        );


    box.className =
        "message " +
        type;


    box.innerText =
        text;


    box.style.display =
        "block";

}


/* =========================================================
   HIDE MESSAGE
========================================================= */

function hideMessage(){

    var box =
        document.getElementById(
            "message"
        );


    box.style.display =
        "none";

}

</script>

</body>
</html>
