<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Hardware | MPGB</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f6;
  color:#1f2937;
}

.main{
  margin-left:255px;
  min-height:100vh;
  padding:30px;
  transition:.25s;
}

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.page-title h1{
  margin:0;
  font-size:28px;
  color:#006633;
}

.page-title p{
  margin:6px 0 0;
  color:#6b7280;
  font-size:14px;
}

.card{
  background:#fff;
  border-radius:16px;
  padding:28px;
  box-shadow:0 5px 25px rgba(0,0,0,.07);
  max-width:1000px;
}

.section-title{
  font-size:18px;
  font-weight:700;
  color:#006633;
  margin-bottom:22px;
  padding-bottom:12px;
  border-bottom:1px solid #e5e7eb;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:20px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-size:13px;
  font-weight:600;
  margin-bottom:7px;
  color:#374151;
}

.required{
  color:#dc2626;
}

input,
select,
textarea{
  width:100%;
  padding:12px 13px;
  border:1px solid #d1d5db;
  border-radius:9px;
  font-size:14px;
  outline:none;
  background:#fff;
  transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#00994d;
  box-shadow:0 0 0 3px rgba(0,153,77,.10);
}

input[readonly]{
  background:#f3f4f6;
  color:#4b5563;
}

textarea{
  resize:vertical;
  min-height:95px;
}

.actions{
  display:flex;
  gap:12px;
  margin-top:25px;
  padding-top:20px;
  border-top:1px solid #e5e7eb;
}

.btn{
  border:0;
  padding:12px 22px;
  border-radius:9px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}

.btn-save{
  background:#006633;
  color:white;
}

.btn-save:hover{
  background:#004d26;
}

.btn-reset{
  background:#e5e7eb;
  color:#374151;
}

.btn-reset:hover{
  background:#d1d5db;
}

.btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-bottom:20px;
  padding:13px 16px;
  border-radius:9px;
  font-size:14px;
}

.message.success{
  display:block;
  background:#dcfce7;
  color:#166534;
  border:1px solid #bbf7d0;
}

.message.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fecaca;
}

.loading{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.sol-info{
  margin-top:7px;
  font-size:12px;
  color:#006633;
  font-weight:600;
}

@media(max-width:900px){
  .main{
    margin-left:72px;
    padding:20px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }
}

@media(max-width:600px){
  .main{
    padding:15px;
  }

  .page-header{
    display:block;
  }

  .page-title h1{
    font-size:23px;
  }

  .card{
    padding:20px;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<!-- Dynamic Sidebar -->
<script src="sidebar.js"></script>

<main class="main">

  <div class="page-header">
    <div class="page-title">
      <h1>➕ Add Hardware</h1>
      <p>Add new hardware details to the MPGB Hardware Management System</p>
    </div>
  </div>

  <div id="message" class="message"></div>

  <div class="card">

    <div class="section-title">
      Hardware Information
    </div>

    <form id="hardwareForm">

      <div class="form-grid">

        <!-- SOL ID -->
        <div class="form-group">
          <label>
            SOL ID <span class="required">*</span>
          </label>

          <select id="solId" required>
            <option value="">Loading SOL List...</option>
          </select>

          <div id="solLoading" class="loading"></div>
        </div>

        <!-- Branch Name -->
        <div class="form-group">
          <label>Branch Name</label>

          <input
            type="text"
            id="branchName"
            readonly
            placeholder="Branch name will appear automatically"
          >
        </div>

        <!-- Hardware Type -->
        <div class="form-group">
          <label>
            Hardware Type <span class="required">*</span>
          </label>

          <select id="hardwareType" required>
            <option value="">Select Hardware Type</option>
            <option value="CPU">CPU</option>
            <option value="Monitor">Monitor</option>
            <option value="Passbook Printer">Passbook Printer</option>
            <option value="Laser Printer">Laser Printer</option>
            <option value="Scanner">Scanner</option>
            <option value="CTS Machine">CTS Machine</option>
            <option value="CCTV Monitor">CCTV Monitor</option>
            <option value="Biometric Device">Biometric Device</option>
            <option value="UPS">UPS</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <!-- Make -->
        <div class="form-group">
          <label>Make</label>

          <input
            type="text"
            id="make"
            placeholder="e.g. HP, Dell, Canon"
          >
        </div>

        <!-- Model -->
        <div class="form-group">
          <label>Model</label>

          <input
            type="text"
            id="model"
            placeholder="Enter model"
          >
        </div>

        <!-- Serial -->
        <div class="form-group">
          <label>Serial Number</label>

          <input
            type="text"
            id="serialNo"
            placeholder="Enter serial number"
          >
        </div>

        <!-- Condition -->
        <div class="form-group">
          <label>
            Condition <span class="required">*</span>
          </label>

          <select id="condition" required>
            <option value="">Select Condition</option>
            <option value="Working">Working</option>
            <option value="Not Working">Not Working</option>
            <option value="Under Repair">Under Repair</option>
            <option value="Damaged">Damaged</option>
          </select>
        </div>

        <!-- Remarks -->
        <div class="form-group full">
          <label>Remarks</label>

          <textarea
            id="remarks"
            placeholder="Enter remarks, if any..."
          ></textarea>
        </div>

      </div>

      <div class="actions">

        <button
          type="submit"
          class="btn btn-save"
          id="saveBtn"
        >
          💾 Save Hardware
        </button>

        <button
          type="button"
          class="btn btn-reset"
          id="resetBtn"
        >
          ↺ Reset
        </button>

      </div>

    </form>

  </div>

</main>

<script>

/* ==========================================
   GOOGLE APPS SCRIPT WEB APP URL
   ========================================== */

var API_URL =
"https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec";


/* ==========================================
   ELEMENTS
   ========================================== */

var solSelect = document.getElementById("solId");
var branchInput = document.getElementById("branchName");
var messageBox = document.getElementById("message");
var saveBtn = document.getElementById("saveBtn");
var solLoading = document.getElementById("solLoading");


/* ==========================================
   SHOW MESSAGE
   ========================================== */

function showMessage(text, type){

  messageBox.className = "message " + type;
  messageBox.textContent = text;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* ==========================================
   CLEAR MESSAGE
   ========================================== */

function clearMessage(){

  messageBox.className = "message";
  messageBox.textContent = "";

}


/* ==========================================
   NORMALIZE SOL ID
   ========================================== */

function normalizeSOL(value){

  value = String(value || "")
    .replace(/\u00A0/g," ")
    .trim();

  var match = value.match(/\b\d{5}\b/);

  if(match){
    return match[0];
  }

  return value.replace(/\s+/g,"");
}


/* ==========================================
   LOAD SOL LIST
   ========================================== */

function loadSOLList(){

  solLoading.textContent = "Loading branch list...";

  fetch(API_URL + "?action=getSOLList", {
    method:"GET"
  })
  .then(function(response){

    if(!response.ok){
      throw new Error("Server returned " + response.status);
    }

    return response.text();

  })
  .then(function(text){

    var data;

    try{
      data = JSON.parse(text);
    }
    catch(e){
      throw new Error("Invalid server response");
    }

    if(!data.success){
      throw new Error(data.message || "Unable to load SOL list");
    }

    solSelect.innerHTML =
      '<option value="">Select SOL ID</option>';

    var list = data.data || [];

    list.forEach(function(item){

      var option = document.createElement("option");

      option.value = normalizeSOL(item.solId);

      option.textContent =
        normalizeSOL(item.solId) +
        " - " +
        (item.branchName || "");

      option.setAttribute(
        "data-branch",
        item.branchName || ""
      );

      solSelect.appendChild(option);

    });

    solLoading.textContent =
      list.length + " SOLs loaded";

  })
  .catch(function(error){

    console.error(error);

    solSelect.innerHTML =
      '<option value="">Unable to load SOL list</option>';

    solLoading.textContent = "";

    showMessage(
      "Unable to load SOL list: " + error.message,
      "error"
    );

  });

}


/* ==========================================
   SOL CHANGE
   ========================================== */

solSelect.addEventListener("change", function(){

  var selected =
    solSelect.options[solSelect.selectedIndex];

  if(!selected || !selected.value){

    branchInput.value = "";
    return;

  }

  branchInput.value =
    selected.getAttribute("data-branch") || "";

});


/* ==========================================
   SAVE HARDWARE
   CORS-SAFE FORM POST
   ========================================== */

document.getElementById("hardwareForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  clearMessage();

  var sol =
    normalizeSOL(
      document.getElementById("solId").value
    );

  var hardwareType =
    document.getElementById("hardwareType").value;

  var make =
    document.getElementById("make").value.trim();

  var model =
    document.getElementById("model").value.trim();

  var serialNo =
    document.getElementById("serialNo").value.trim();

  var condition =
    document.getElementById("condition").value;

  var remarks =
    document.getElementById("remarks").value.trim();


  /* VALIDATION */

  if(!sol){

    showMessage(
      "Please select SOL ID.",
      "error"
    );

    return;
  }

  if(!/^\d{5}$/.test(sol)){

    showMessage(
      "Invalid SOL ID. Please select a valid 5 digit SOL ID.",
      "error"
    );

    return;
  }

  if(!hardwareType){

    showMessage(
      "Please select Hardware Type.",
      "error"
    );

    return;
  }

  if(!condition){

    showMessage(
      "Please select Condition.",
      "error"
    );

    return;
  }


  /* DISABLE BUTTON */

  saveBtn.disabled = true;
  saveBtn.textContent = "⏳ Saving...";


  /*
     IMPORTANT:
     Do NOT use application/json here.

     URLSearchParams sends normal form data
     and avoids CORS preflight.
  */

  var formData = new URLSearchParams();

  formData.append("action","save");
  formData.append("solId",sol);
  formData.append("hardwareType",hardwareType);
  formData.append("make",make);
  formData.append("model",model);
  formData.append("serialNo",serialNo);
  formData.append("condition",condition);
  formData.append("remarks",remarks);


  fetch(API_URL, {

    method:"POST",

    body:formData

  })

  .then(function(response){

    if(!response.ok){

      throw new Error(
        "Server returned " + response.status
      );

    }

    return response.text();

  })

  .then(function(text){

    var result;

    try{

      result = JSON.parse(text);

    }
    catch(e){

      console.error("Server response:",text);

      throw new Error(
        "Invalid response received from server."
      );

    }


    if(result.success){

      showMessage(
        "✅ Hardware saved successfully.",
        "success"
      );

      document.getElementById("hardwareForm").reset();

      branchInput.value = "";

      /* Keep SOL list */

    }
    else{

      throw new Error(
        result.message ||
        "Unable to save hardware."
      );

    }

  })

  .catch(function(error){

    console.error("SAVE ERROR:",error);

    showMessage(
      "Unable to save hardware: " +
      error.message,
      "error"
    );

  })

  .finally(function(){

    saveBtn.disabled = false;
    saveBtn.textContent = "💾 Save Hardware";

  });

});


/* ==========================================
   RESET
   ========================================== */

document.getElementById("resetBtn")
.addEventListener("click", function(){

  document.getElementById("hardwareForm").reset();

  branchInput.value = "";

  clearMessage();

});


/* ==========================================
   INITIAL LOAD
   ========================================== */

loadSOLList();

</script>

</body>
</html>
