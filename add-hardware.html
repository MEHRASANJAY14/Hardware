<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MPGB | Add Hardware</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7f5;
    color:#263238;
}

/* ================= MAIN ================= */

.main{
    margin-left:255px;
    min-height:100vh;
    padding:22px;
}

/* ================= HEADER ================= */

.page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.title-box{
    display:flex;
    align-items:center;
    gap:12px;
}

.title-icon{
    width:46px;
    height:46px;
    border-radius:11px;
    background:#006400;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
}

.title-box h1{
    margin:0;
    color:#075b2b;
    font-size:23px;
}

.title-box p{
    margin:3px 0 0;
    color:#7b8790;
    font-size:11px;
}

.status{
    font-size:11px;
    color:#08752d;
    background:#e7f7ec;
    padding:8px 12px;
    border-radius:18px;
}

.status-dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#16a34a;
    margin-right:5px;
}

/* ================= CARD ================= */

.card{
    max-width:1050px;
    background:#fff;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    overflow:hidden;
}

/* ================= CARD HEADER ================= */

.card-header{
    background:#006400;
    color:#fff;
    padding:17px 22px;
}

.card-header h2{
    margin:0;
    font-size:16px;
}

.card-header p{
    margin:4px 0 0;
    font-size:11px;
    opacity:.78;
}

/* ================= FORM ================= */

.form-body{
    padding:22px;
}

.section{
    margin-bottom:20px;
}

.section-title{
    font-size:12px;
    font-weight:bold;
    color:#006400;
    border-left:4px solid #006400;
    padding-left:8px;
    margin-bottom:13px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
}

.field label{
    display:block;
    font-size:11px;
    font-weight:bold;
    color:#46515a;
    margin-bottom:6px;
}

.required{
    color:#d32f2f;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #d8dee2;
    border-radius:7px;
    background:#fafcfa;
    padding:10px 11px;
    font-size:13px;
    color:#263238;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#00823b;
    background:#fff;
    box-shadow:0 0 0 2px rgba(0,130,59,.08);
}

textarea{
    height:75px;
    resize:vertical;
}

.full{
    grid-column:1/-1;
}

/* ================= BRANCH ================= */

.branch-name{
    min-height:17px;
    margin-top:5px;
    font-size:10px;
    color:#006400;
    font-weight:bold;
}

/* ================= BUTTON ================= */

.actions{
    border-top:1px solid #edf0ef;
    padding-top:17px;
    display:flex;
    justify-content:flex-end;
    gap:9px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 20px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn{
    background:#006400;
    color:#fff;
}

.save-btn:hover{
    background:#00823b;
}

.reset-btn{
    background:#eef1f2;
    color:#4b5563;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* ================= MESSAGE ================= */

.message{
    display:none;
    padding:10px 12px;
    border-radius:7px;
    margin-bottom:17px;
    font-size:12px;
}

.message.success{
    display:block;
    background:#e8f7ed;
    color:#08752d;
    border:1px solid #c5e8ce;
}

.message.error{
    display:block;
    background:#fff0f0;
    color:#a00000;
    border:1px solid #f0c5c5;
}

.message.loading{
    display:block;
    background:#edf5ff;
    color:#24558c;
    border:1px solid #d0e1f5;
}

/* ================= LOADING ================= */

.loading-option{
    color:#888;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    .main{
        margin-left:72px;
        padding:15px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .status{
        display:none;
    }

}

@media(max-width:500px){

    .main{
        margin-left:70px;
        padding:10px;
    }

    .page-header{
        margin-bottom:13px;
    }

    .title-box h1{
        font-size:19px;
    }

    .title-icon{
        width:40px;
        height:40px;
        font-size:19px;
    }

    .form-body{
        padding:16px;
    }

    .actions{
        flex-direction:column;
    }

    button{
        width:100%;
    }

}
</style>
</head>

<body>

<!-- DYNAMIC SIDEBAR -->
<script src="sidebar.js"></script>


<main class="main">

    <!-- HEADER -->

    <div class="page-header">

        <div class="title-box">

            <div class="title-icon">
                ＋
            </div>

            <div>

                <h1>Add Hardware</h1>

                <p>
                    MPGB Hardware Inventory Portal
                </p>

            </div>

        </div>


        <div class="status">
            <span class="status-dot"></span>
            Portal Active
        </div>

    </div>


    <!-- CARD -->

    <div class="card">

        <div class="card-header">

            <h2>Hardware Registration</h2>

            <p>
                Enter the hardware details below
            </p>

        </div>


        <div class="form-body">

            <!-- MESSAGE -->

            <div
                id="message"
                class="message">
            </div>


            <form id="hardwareForm">


                <!-- ================= BRANCH ================= -->

                <div class="section">

                    <div class="section-title">
                        Branch Information
                    </div>


                    <div class="grid">


                        <!-- SOL -->

                        <div class="field">

                            <label>
                                SOL ID
                                <span class="required">*</span>
                            </label>

                            <select
                                id="solId"
                                required>

                                <option value="">
                                    Loading branches...
                                </option>

                            </select>


                            <div
                                id="branchName"
                                class="branch-name">
                            </div>

                        </div>


                        <!-- HARDWARE TYPE -->

                        <div class="field">

                            <label>
                                Hardware Type
                                <span class="required">*</span>
                            </label>

                            <select
                                id="hardwareType"
                                required>

                                <option value="">
                                    Select Hardware Type
                                </option>

                                <option value="CPU">
                                    CPU
                                </option>

                                <option value="Monitor">
                                    Monitor
                                </option>

                                <option value="Passbook Printer">
                                    Passbook Printer
                                </option>

                                <option value="Laser Printer">
                                    Laser Printer
                                </option>

                                <option value="Scanner">
                                    Scanner
                                </option>

                                <option value="CTS Machine">
                                    CTS Machine
                                </option>

                                <option value="CCTV Monitor">
                                    CCTV Monitor
                                </option>

                                <option value="Biometric Device">
                                    Biometric Device
                                </option>

                                <option value="UPS">
                                    UPS
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>

                    </div>

                </div>


                <!-- ================= HARDWARE ================= -->

                <div class="section">

                    <div class="section-title">
                        Hardware Details
                    </div>


                    <div class="grid">


                        <!-- MAKE -->

                        <div class="field">

                            <label>
                                Make
                            </label>

                            <input
                                type="text"
                                id="make"
                                placeholder="HP / Dell / Canon">

                        </div>


                        <!-- MODEL -->

                        <div class="field">

                            <label>
                                Model
                            </label>

                            <input
                                type="text"
                                id="model"
                                placeholder="Enter model">

                        </div>


                        <!-- SERIAL -->

                        <div class="field">

                            <label>
                                Serial Number
                            </label>

                            <input
                                type="text"
                                id="serialNo"
                                placeholder="Enter serial number">

                        </div>


                        <!-- CONDITION -->

                        <div class="field">

                            <label>
                                Condition
                                <span class="required">*</span>
                            </label>

                            <select
                                id="condition"
                                required>

                                <option value="">
                                    Select Condition
                                </option>

                                <option value="WORKING">
                                    WORKING
                                </option>

                                <option value="NOT WORKING">
                                    NOT WORKING
                                </option>

                                <option value="UNDER REPAIR">
                                    UNDER REPAIR
                                </option>

                                <option value="DAMAGED">
                                    DAMAGED
                                </option>

                            </select>

                        </div>


                        <!-- REMARKS -->

                        <div class="field full">

                            <label>
                                Remarks
                            </label>

                            <textarea
                                id="remarks"
                                placeholder="Enter remarks if required"></textarea>

                        </div>

                    </div>

                </div>


                <!-- ACTION -->

                <div class="actions">

                    <button
                        type="button"
                        class="reset-btn"
                        onclick="resetForm()">

                        Reset

                    </button>


                    <button
                        type="submit"
                        class="save-btn"
                        id="saveButton">

                        Save Hardware

                    </button>

                </div>


            </form>

        </div>

    </div>

</main>


<script>

/* =========================================================
   API
========================================================= */

var API_URL =
"https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec";


var branches = [];


/* =========================================================
   LOAD
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadBranches();

    }
);


/* =========================================================
   LOAD BRANCH LIST
========================================================= */

function loadBranches(){

    var select =
        document.getElementById(
            "solId"
        );


    select.innerHTML =
        '<option value="">Loading branches...</option>';


    fetch(
        API_URL +
        "?action=getSOLList&t=" +
        Date.now()
    )

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "Server error"
            );

        }

        return response.json();

    })

    .then(function(result){

        if(
            result.success !== true &&
            result.status !== "success"
        ){

            throw new Error(
                result.message ||
                "Unable to load branches"
            );

        }


        branches =
            Array.isArray(result.data)
            ? result.data
            : [];


        select.innerHTML =
            '<option value="">Select SOL ID</option>';


        branches.forEach(
            function(branch){

                var sol =
                    normalizeSOL(
                        branch.solId
                    );


                var option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    sol;


                option.textContent =
                    sol +
                    " - " +
                    branch.branchName;


                select.appendChild(
                    option
                );

            }
        );


        if(!branches.length){

            select.innerHTML =
                '<option value="">No branch found</option>';

        }

    })

    .catch(function(error){

        select.innerHTML =
            '<option value="">Unable to load branches</option>';


        showMessage(
            "Branch list could not be loaded. Please refresh the page.",
            "error"
        );


        console.error(
            error
        );

    });

}


/* =========================================================
   SOL CHANGE
========================================================= */

document
.getElementById("solId")
.addEventListener(
    "change",
    function(){

        var sol =
            normalizeSOL(
                this.value
            );


        var branch =
            branches.find(
                function(item){

                    return normalizeSOL(
                        item.solId
                    ) === sol;

                }
            );


        document
        .getElementById(
            "branchName"
        )
        .innerText =
            branch
            ? "Branch: " +
              branch.branchName
            : "";

    }
);


/* =========================================================
   SAVE
========================================================= */

document
.getElementById("hardwareForm")
.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        saveHardware();

    }
);


function saveHardware(){

    var sol =
        normalizeSOL(
            document.getElementById(
                "solId"
            ).value
        );


    var hardwareType =
        document.getElementById(
            "hardwareType"
        ).value.trim();


    var make =
        document.getElementById(
            "make"
        ).value.trim();


    var model =
        document.getElementById(
            "model"
        ).value.trim();


    var serialNo =
        document.getElementById(
            "serialNo"
        ).value.trim();


    var condition =
        document.getElementById(
            "condition"
        ).value.trim();


    var remarks =
        document.getElementById(
            "remarks"
        ).value.trim();


    /* VALIDATION */

    if(!sol){

        showMessage(
            "Please select SOL ID.",
            "error"
        );

        return;

    }


    if(!hardwareType){

        showMessage(
            "Please select Hardware Type.",
            "error"
        );

        return;

    }


    if(!condition){

        showMessage(
            "Please select Condition.",
            "error"
        );

        return;

    }


    var branch =
        branches.find(
            function(item){

                return normalizeSOL(
                    item.solId
                ) === sol;

            }
        );


    if(!branch){

        showMessage(
            "Invalid SOL ID.",
            "error"
        );

        return;

    }


    /* DATA */

    var data = {

        action:"save",

        solId:sol,

        hardwareType:
            hardwareType,

        make:make,

        model:model,

        serialNo:serialNo,

        condition:condition,

        remarks:remarks

    };


    var button =
        document.getElementById(
            "saveButton"
        );


    button.disabled =
        true;

    button.innerText =
        "Saving...";


    showMessage(
        "Saving hardware record...",
        "loading"
    );


    fetch(
        API_URL,
        {
            method:"POST",

            headers:{
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(data)
        }
    )

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "Server error"
            );

        }

        return response.json();

    })

    .then(function(result){

        if(
            result.success === true ||
            result.status === "success"
        ){

            var message =
                "Hardware saved successfully.";

            if(result.submissionId){

                message +=
                    " ID: " +
                    result.submissionId;

            }


            showMessage(
                message,
                "success"
            );


            /*
             * Keep SOL selected.
             * Clear remaining fields.
             */

            document.getElementById(
                "hardwareType"
            ).value = "";


            document.getElementById(
                "make"
            ).value = "";


            document.getElementById(
                "model"
            ).value = "";


            document.getElementById(
                "serialNo"
            ).value = "";


            document.getElementById(
                "condition"
            ).value = "";


            document.getElementById(
                "remarks"
            ).value = "";

        }
        else{

            showMessage(
                result.message ||
                "Unable to save record.",
                "error"
            );

        }

    })

    .catch(function(error){

        console.error(
            error
        );


        showMessage(
            "Unable to save record. Please try again.",
            "error"
        );

    })

    .finally(function(){

        button.disabled =
            false;

        button.innerText =
            "Save Hardware";

    });

}


/* =========================================================
   RESET
========================================================= */

function resetForm(){

    document
    .getElementById(
        "hardwareForm"
    )
    .reset();


    document
    .getElementById(
        "branchName"
    )
    .innerText =
        "";


    hideMessage();

}


/* =========================================================
   NORMALIZE SOL
========================================================= */

function normalizeSOL(value){

    var text =
        String(value || "")
        .replace(
            /\u00A0/g,
            " "
        )
        .trim();


    var match =
        text.match(
            /\b\d{5}\b/
        );


    if(match){

        return match[0];

    }


    return text.replace(
        /\s+/g,
        ""
    );

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type
){

    var box =
        document.getElementById(
            "message"
        );


    box.className =
        "message " +
        type;


    box.innerText =
        text;


    box.style.display =
        "block";

}


function hideMessage(){

    document.getElementById(
        "message"
    ).style.display =
        "none";

}

</script>

</body>
</html>
