<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Hardware | MPGB Hardware Portal</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7f6;
  color:#1f2937;
}

body{
  min-height:100vh;
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
  margin-left:260px;
  min-height:100vh;
  padding:30px;
  transition:margin-left .28s ease;
}

/* =========================================================
   HEADER
   ========================================================= */

.page-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.page-title h1{
  margin:0;
  font-size:28px;
  font-weight:750;
  color:#006633;
}

.page-title p{
  margin:7px 0 0;
  color:#6b7280;
  font-size:14px;
}

/* =========================================================
   CARD
   ========================================================= */

.card{
  width:100%;
  max-width:1050px;
  background:#ffffff;
  border-radius:18px;
  padding:30px;
  box-shadow:
    0 8px 30px rgba(0,0,0,.07);
}

/* =========================================================
   SECTION
   ========================================================= */

.section-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:25px;
  padding-bottom:15px;
  border-bottom:1px solid #e5e7eb;
}

.section-icon{
  width:42px;
  height:42px;
  border-radius:11px;
  background:#e7f5ed;
  color:#006633;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.section-title{
  margin:0;
  color:#006633;
  font-size:18px;
}

.section-subtitle{
  margin:4px 0 0;
  color:#6b7280;
  font-size:12px;
}

/* =========================================================
   MESSAGE
   ========================================================= */

.message{
  display:none;
  max-width:1050px;
  margin-bottom:18px;
  padding:14px 17px;
  border-radius:10px;
  font-size:14px;
  line-height:1.5;
}

.message.success{
  display:block;
  color:#166534;
  background:#dcfce7;
  border:1px solid #bbf7d0;
}

.message.error{
  display:block;
  color:#991b1b;
  background:#fee2e2;
  border:1px solid #fecaca;
}

.message.info{
  display:block;
  color:#1e40af;
  background:#dbeafe;
  border:1px solid #bfdbfe;
}

/* =========================================================
   FORM
   ========================================================= */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:21px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  margin-bottom:7px;
  font-size:13px;
  font-weight:650;
  color:#374151;
}

.required{
  color:#dc2626;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:9px;
  padding:12px 13px;
  background:#fff;
  color:#111827;
  font-size:14px;
  outline:none;
  transition:
    border-color .2s,
    box-shadow .2s,
    background .2s;
}

input:hover,
select:hover,
textarea:hover{
  border-color:#9ca3af;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#00994d;
  box-shadow:
    0 0 0 3px rgba(0,153,77,.10);
}

input[readonly]{
  background:#f3f4f6;
  color:#4b5563;
}

textarea{
  min-height:100px;
  resize:vertical;
}

/* =========================================================
   SOL INFO
   ========================================================= */

.sol-status{
  min-height:18px;
  margin-top:6px;
  font-size:11px;
  color:#6b7280;
}

.sol-status.ok{
  color:#15803d;
}

.sol-status.error{
  color:#dc2626;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.actions{
  display:flex;
  gap:12px;
  margin-top:27px;
  padding-top:22px;
  border-top:1px solid #e5e7eb;
}

.btn{
  border:0;
  border-radius:9px;
  padding:12px 22px;
  font-size:14px;
  font-weight:650;
  cursor:pointer;
  transition:
    transform .15s,
    box-shadow .15s,
    background .2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn:disabled{
  opacity:.65;
  cursor:not-allowed;
  transform:none;
}

.btn-save{
  color:#fff;
  background:#006633;
  box-shadow:
    0 4px 12px rgba(0,102,51,.18);
}

.btn-save:hover{
  background:#005426;
}

.btn-reset{
  background:#e5e7eb;
  color:#374151;
}

.btn-reset:hover{
  background:#d1d5db;
}

/* =========================================================
   LOADING
   ========================================================= */

.loading-overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.55);
  z-index:99998;
  align-items:center;
  justify-content:center;
  backdrop-filter:blur(2px);
}

.loading-box{
  background:#fff;
  border-radius:14px;
  padding:22px 28px;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
  color:#006633;
  font-weight:600;
}

.spinner{
  display:inline-block;
  width:18px;
  height:18px;
  border:3px solid #d1fae5;
  border-top-color:#006633;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
  margin-right:8px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:900px){

  .main{
    margin-left:72px;
    padding:22px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .form-group.full{
    grid-column:auto;
  }

}

@media(max-width:600px){

  .main{
    margin-left:64px;
    padding:15px;
  }

  .page-title h1{
    font-size:23px;
  }

  .page-title p{
    font-size:12px;
  }

  .card{
    padding:20px;
    border-radius:14px;
  }

  .actions{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }

}
</style>
</head>

<body>

<!-- =======================================================
     DYNAMIC SIDEBAR
     ======================================================= -->

<script src="sidebar.js"></script>


<!-- =======================================================
     LOADING
     ======================================================= -->

<div id="loadingOverlay" class="loading-overlay">

  <div class="loading-box">

    <span class="spinner"></span>

    Saving hardware...

  </div>

</div>


<!-- =======================================================
     MAIN
     ======================================================= -->

<main class="main">

  <div class="page-header">

    <div class="page-title">

      <h1>➕ Add Hardware</h1>

      <p>
        Register new hardware in the MPGB Hardware Management System
      </p>

    </div>

  </div>


  <!-- MESSAGE -->

  <div id="message" class="message"></div>


  <!-- CARD -->

  <div class="card">

    <div class="section-header">

      <div class="section-icon">
        🖥
      </div>

      <div>

        <h2 class="section-title">
          Hardware Information
        </h2>

        <p class="section-subtitle">
          Enter the hardware details below
        </p>

      </div>

    </div>


    <!-- ===================================================
         FORM
         =================================================== -->

    <form id="hardwareForm">

      <div class="form-grid">


        <!-- SOL ID -->

        <div class="form-group">

          <label>
            SOL ID
            <span class="required">*</span>
          </label>

          <select id="solId" required>

            <option value="">
              Loading SOL list...
            </option>

          </select>

          <div id="solStatus" class="sol-status">
            Loading branch list...
          </div>

        </div>


        <!-- BRANCH NAME -->

        <div class="form-group">

          <label>
            Branch Name
          </label>

          <input
            type="text"
            id="branchName"
            readonly
            placeholder="Branch name will appear automatically"
          >

        </div>


        <!-- HARDWARE TYPE -->

        <div class="form-group">

          <label>
            Hardware Type
            <span class="required">*</span>
          </label>

          <select id="hardwareType" required>

            <option value="">
              Select Hardware Type
            </option>

            <option value="CPU">
              CPU
            </option>

            <option value="Monitor">
              Monitor
            </option>

            <option value="Passbook Printer">
              Passbook Printer
            </option>

            <option value="Laser Printer">
              Laser Printer
            </option>

            <option value="Scanner">
              Scanner
            </option>

            <option value="CTS Machine">
              CTS Machine
            </option>

            <option value="CCTV Monitor">
              CCTV Monitor
            </option>

            <option value="Biometric Device">
              Biometric Device
            </option>

            <option value="UPS">
              UPS
            </option>

            <option value="Other">
              Other
            </option>

          </select>

        </div>


        <!-- MAKE -->

        <div class="form-group">

          <label>
            Make
          </label>

          <input
            type="text"
            id="make"
            placeholder="e.g. HP, Dell, Canon"
          >

        </div>


        <!-- MODEL -->

        <div class="form-group">

          <label>
            Model
          </label>

          <input
            type="text"
            id="model"
            placeholder="Enter model"
          >

        </div>


        <!-- SERIAL NUMBER -->

        <div class="form-group">

          <label>
            Serial Number
          </label>

          <input
            type="text"
            id="serialNo"
            placeholder="Enter serial number"
          >

        </div>


        <!-- CONDITION -->

        <div class="form-group">

          <label>
            Condition
            <span class="required">*</span>
          </label>

          <select id="condition" required>

            <option value="">
              Select Condition
            </option>

            <option value="Working">
              Working
            </option>

            <option value="Not Working">
              Not Working
            </option>

            <option value="Under Repair">
              Under Repair
            </option>

            <option value="Damaged">
              Damaged
            </option>

          </select>

        </div>


        <!-- REMARKS -->

        <div class="form-group full">

          <label>
            Remarks
          </label>

          <textarea
            id="remarks"
            placeholder="Enter remarks, if any..."
          ></textarea>

        </div>

      </div>


      <!-- =================================================
           ACTIONS
           ================================================= -->

      <div class="actions">

        <button
          type="submit"
          id="saveBtn"
          class="btn btn-save"
        >
          💾 Save Hardware
        </button>

        <button
          type="button"
          id="resetBtn"
          class="btn btn-reset"
        >
          ↺ Reset
        </button>

      </div>

    </form>

  </div>

</main>


<script>

/* =========================================================
   GOOGLE APPS SCRIPT WEB APP
   ========================================================= */

var API_URL =
"https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec";


/* =========================================================
   ELEMENTS
   ========================================================= */

var form =
  document.getElementById("hardwareForm");

var solSelect =
  document.getElementById("solId");

var branchName =
  document.getElementById("branchName");

var solStatus =
  document.getElementById("solStatus");

var messageBox =
  document.getElementById("message");

var saveBtn =
  document.getElementById("saveBtn");

var resetBtn =
  document.getElementById("resetBtn");

var loadingOverlay =
  document.getElementById("loadingOverlay");


/* =========================================================
   NORMALIZE SOL
   ========================================================= */

function normalizeSOL(value){

  value = String(value || "")
    .replace(/\u00A0/g," ")
    .trim();

  var match =
    value.match(/\b\d{5}\b/);

  if(match){
    return match[0];
  }

  return value.replace(/\s+/g,"");

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text,type){

  messageBox.className =
    "message " + type;

  messageBox.textContent =
    text;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function clearMessage(){

  messageBox.className =
    "message";

  messageBox.textContent =
    "";

}


/* =========================================================
   LOAD SOL LIST
   ========================================================= */

function loadSOLList(){

  solStatus.textContent =
    "Loading branch list...";

  solStatus.className =
    "sol-status";


  fetch(
    API_URL +
    "?action=getSOLList&_=" +
    new Date().getTime(),
    {
      method:"GET",
      cache:"no-store"
    }
  )

  .then(function(response){

    if(!response.ok){

      throw new Error(
        "Server returned " +
        response.status
      );

    }

    return response.text();

  })

  .then(function(text){

    var data;

    try{

      data =
        JSON.parse(text);

    }
    catch(error){

      console.error(
        "SOL RESPONSE:",
        text
      );

      throw new Error(
        "Invalid response from server."
      );

    }


    if(!data.success){

      throw new Error(
        data.message ||
        "Unable to load SOL list."
      );

    }


    var list =
      data.data || [];


    solSelect.innerHTML =
      '<option value="">Select SOL ID</option>';


    list.forEach(function(item){

      var sol =
        normalizeSOL(
          item.solId
        );

      var option =
        document.createElement(
          "option"
        );

      option.value =
        sol;

      option.textContent =
        sol +
        " - " +
        (item.branchName || "");

      option.dataset.branch =
        item.branchName || "";

      solSelect.appendChild(
        option
      );

    });


    solStatus.textContent =
      list.length +
      " SOLs available";

    solStatus.className =
      "sol-status ok";

  })

  .catch(function(error){

    console.error(
      "SOL LOAD ERROR:",
      error
    );

    solSelect.innerHTML =
      '<option value="">Unable to load SOL list</option>';

    solStatus.textContent =
      error.message;

    solStatus.className =
      "sol-status error";

    showMessage(
      "Unable to load SOL list: " +
      error.message,
      "error"
    );

  });

}


/* =========================================================
   SOL CHANGE
   ========================================================= */

solSelect.addEventListener(
  "change",
  function(){

    var option =
      solSelect.options[
        solSelect.selectedIndex
      ];


    if(
      !option ||
      !option.value
    ){

      branchName.value =
        "";

      return;

    }


    branchName.value =
      option.dataset.branch ||
      "";

  }
);


/* =========================================================
   SAVE HARDWARE
   ========================================================= */

form.addEventListener(
  "submit",
  function(e){

    e.preventDefault();

    clearMessage();


    /* -----------------------------------------------
       GET VALUES
       ----------------------------------------------- */

    var sol =
      normalizeSOL(
        solSelect.value
      );

    var hardwareType =
      document.getElementById(
        "hardwareType"
      ).value;

    var make =
      document.getElementById(
        "make"
      ).value.trim();

    var model =
      document.getElementById(
        "model"
      ).value.trim();

    var serialNo =
      document.getElementById(
        "serialNo"
      ).value.trim();

    var condition =
      document.getElementById(
        "condition"
      ).value;

    var remarks =
      document.getElementById(
        "remarks"
      ).value.trim();


    /* -----------------------------------------------
       VALIDATION
       ----------------------------------------------- */

    if(!sol){

      showMessage(
        "Please select SOL ID.",
        "error"
      );

      return;

    }


    if(!/^\d{5}$/.test(sol)){

      showMessage(
        "Invalid SOL ID. Please select a valid 5 digit SOL ID.",
        "error"
      );

      return;

    }


    if(!hardwareType){

      showMessage(
        "Please select Hardware Type.",
        "error"
      );

      return;

    }


    if(!condition){

      showMessage(
        "Please select Condition.",
        "error"
      );

      return;

    }


    /* -----------------------------------------------
       BUILD SAVE URL

       IMPORTANT:
       We are using GET because your Code.gs
       already supports:

       ?action=save

       This avoids the previous POST/CORS issue.
       ----------------------------------------------- */

    var params =
      new URLSearchParams();


    params.append(
      "action",
      "save"
    );

    params.append(
      "solId",
      sol
    );

    params.append(
      "hardwareType",
      hardwareType
    );

    params.append(
      "make",
      make
    );

    params.append(
      "model",
      model
    );

    params.append(
      "serialNo",
      serialNo
    );

    params.append(
      "condition",
      condition
    );

    params.append(
      "remarks",
      remarks
    );


    var saveURL =
      API_URL +
      "?" +
      params.toString() +
      "&_=" +
      new Date().getTime();


    /* -----------------------------------------------
       UI
       ----------------------------------------------- */

    saveBtn.disabled =
      true;

    saveBtn.innerHTML =
      '<span class="spinner"></span> Saving...';

    loadingOverlay.style.display =
      "flex";


    /* -----------------------------------------------
       API CALL
       ----------------------------------------------- */

    fetch(
      saveURL,
      {
        method:"GET",
        cache:"no-store"
      }
    )

    .then(function(response){

      if(!response.ok){

        throw new Error(
          "Server returned HTTP " +
          response.status
        );

      }

      return response.text();

    })

    .then(function(text){

      console.log(
        "SAVE RESPONSE:",
        text
      );


      var result;

      try{

        result =
          JSON.parse(text);

      }
      catch(error){

        console.error(
          "INVALID RESPONSE:",
          text
        );

        throw new Error(
          "Invalid response received from server."
        );

      }


      /* ---------------------------------------------
         SUCCESS
         --------------------------------------------- */

      if(result.success){

        showMessage(
          "✅ Hardware saved successfully.",
          "success"
        );


        form.reset();

        branchName.value =
          "";


        /* Keep SOL list loaded */


      }
      else{

        throw new Error(
          result.message ||
          "Unable to save hardware."
        );

      }

    })

    .catch(function(error){

      console.error(
        "SAVE HARDWARE ERROR:",
        error
      );


      showMessage(
        "Unable to save hardware: " +
        error.message,
        "error"
      );

    })

    .finally(function(){

      saveBtn.disabled =
        false;

      saveBtn.innerHTML =
        "💾 Save Hardware";

      loadingOverlay.style.display =
        "none";

    });

  }
);


/* =========================================================
   RESET
   ========================================================= */

resetBtn.addEventListener(
  "click",
  function(){

    form.reset();

    branchName.value =
      "";

    clearMessage();

  }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

loadSOLList();

</script>

</body>
</html>
