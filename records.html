<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hardware Records - MPGB</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7f6;
    color:#222;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:245px;
    height:100vh;
    background:#006400;
    color:#fff;
    padding:22px 14px;
    z-index:1000;
    box-shadow:3px 0 12px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:28px;
}

.logo small{
    display:block;
    font-size:11px;
    font-weight:normal;
    margin-top:5px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    text-decoration:none;
    padding:13px 14px;
    border-radius:9px;
    margin:5px 0;
    font-size:14px;
    transition:.2s;
}

.menu a:hover{
    background:#00823b;
}

.menu a.active{
    background:#00823b;
    box-shadow:inset 4px 0 #fff;
}

.menu i{
    width:22px;
    text-align:center;
    font-style:normal;
    font-size:18px;
}

/* ================= MAIN ================= */

.main{
    margin-left:245px;
    padding:25px;
}

.header{
    background:#fff;
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.header h1{
    color:#006400;
    font-size:27px;
}

.header p{
    color:#666;
    margin-top:7px;
}

/* ================= FILTER ================= */

.filter-card{
    background:#fff;
    padding:18px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.filter-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr auto;
    gap:12px;
}

input,
select{
    width:100%;
    padding:11px 12px;
    border:1px solid #d4dcd7;
    border-radius:8px;
    outline:none;
    background:white;
    font-size:13px;
}

input:focus,
select:focus{
    border-color:#00823b;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 18px;
    cursor:pointer;
    font-weight:bold;
}

.btn-reset{
    background:#e9eeeb;
    color:#333;
}

.btn-reset:hover{
    background:#dce4df;
}

/* ================= RECORD CARD ================= */

.record-card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.record-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.record-top h2{
    color:#006400;
    font-size:20px;
}

.count{
    background:#e6f4eb;
    color:#006400;
    padding:7px 12px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

/* ================= TABLE ================= */

.table-wrap{
    overflow:auto;
    max-height:calc(100vh - 250px);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1250px;
}

th{
    background:#006400;
    color:white;
    padding:11px 9px;
    font-size:12px;
    text-align:left;
    position:sticky;
    top:0;
    z-index:5;
}

td{
    padding:9px;
    border-bottom:1px solid #eee;
    font-size:12px;
    white-space:nowrap;
}

tr:hover{
    background:#f3faf5;
}

/* ================= CONDITION ================= */

.condition{
    display:inline-block;
    padding:5px 8px;
    border-radius:15px;
    font-size:11px;
    font-weight:bold;
}

.working{
    background:#e4f7ea;
    color:#08752d;
}

.notworking{
    background:#ffe7e7;
    color:#b00020;
}

.repair{
    background:#fff2d8;
    color:#9a6100;
}

.damaged{
    background:#eee;
    color:#555;
}

/* ================= ACTION ================= */

.action{
    display:flex;
    gap:5px;
}

.btn-edit{
    background:#006400;
    color:white;
    padding:7px 10px;
    font-size:11px;
}

.btn-edit:hover{
    background:#00823b;
}

.btn-delete{
    background:#d00000;
    color:white;
    padding:7px 10px;
    font-size:11px;
}

.btn-delete:hover{
    background:#a90000;
}

/* ================= LOADING ================= */

.loading{
    text-align:center;
    padding:40px;
    color:#777;
}

.error{
    background:#ffe8e8;
    color:#b00020;
    padding:15px;
    border-radius:8px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1100px){

    .filter-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:800px){

    .sidebar{
        width:70px;
        padding:15px 8px;
    }

    .logo{
        font-size:0;
    }

    .logo:before{
        content:"MP";
        font-size:20px;
    }

    .logo small,
    .menu span{
        display:none;
    }

    .menu a{
        justify-content:center;
        padding:12px;
    }

    .main{
        margin-left:70px;
        padding:15px;
    }

}

@media(max-width:500px){

    .filter-grid{
        grid-template-columns:1fr;
    }

    .main{
        padding:10px;
    }

}

</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        MPGB
        <small>Hardware Management</small>
    </div>

    <nav class="menu">

        <a href="index.html">
            <i>⌂</i>
            <span>Dashboard</span>
        </a>

        <a href="add-hardware.html">
            <i>＋</i>
            <span>Add Hardware</span>
        </a>

        <a href="records.html">
            <i>▣</i>
            <span>Hardware Records</span>
        </a>

        <a href="edit-hardware.html">
            <i>✎</i>
            <span>Edit / Update</span>
        </a>

        <a href="branch-summary.html">
            <i>▥</i>
            <span>Branch Summary</span>
        </a>

        <a href="hardware-summary.html">
            <i>◈</i>
            <span>Hardware Summary</span>
        </a>

        <a href="reports.html">
            <i>▤</i>
            <span>Reports</span>
        </a>

    </nav>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <div class="header">

        <h1>Hardware Records</h1>

        <p>
            View, search, edit and delete hardware records
        </p>

    </div>


    <!-- ================= FILTER ================= -->

    <div class="filter-card">

        <div class="filter-grid">

            <input
                type="text"
                id="search"
                placeholder="Search SOL, branch, make, model, serial no..."
            >


            <select id="solFilter">

                <option value="">
                    All Branches
                </option>

            </select>


            <select id="hardwareFilter">

                <option value="">
                    All Hardware
                </option>

                <option value="CPU">CPU</option>
                <option value="Monitor">Monitor</option>
                <option value="Passbook Printer">Passbook Printer</option>
                <option value="Laser Printer">Laser Printer</option>
                <option value="Scanner">Scanner</option>
                <option value="CTS Machine">CTS Machine</option>
                <option value="CCTV Monitor">CCTV Monitor</option>
                <option value="Biometric Device">Biometric Device</option>
                <option value="UPS">UPS</option>
                <option value="Other">Other</option>

            </select>


            <select id="conditionFilter">

                <option value="">
                    All Conditions
                </option>

                <option value="WORKING">
                    Working
                </option>

                <option value="NOT WORKING">
                    Not Working
                </option>

                <option value="UNDER REPAIR">
                    Under Repair
                </option>

                <option value="DAMAGED">
                    Damaged
                </option>

            </select>


            <button
                class="btn-reset"
                onclick="resetFilters()">

                Reset

            </button>

        </div>

    </div>


    <!-- ================= RECORDS ================= -->

    <div class="record-card">

        <div class="record-top">

            <h2>Hardware Records</h2>

            <div class="count">

                Showing:
                <span id="count">0</span>

            </div>

        </div>


        <div id="tableContainer"
             class="loading">

            Loading hardware records...

        </div>

    </div>

</main>


<script>

/* =====================================================
   API
===================================================== */

var API_URL =
"https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec";


var allRecords=[];


/* =====================================================
   ACTIVE SIDEBAR
===================================================== */

document.addEventListener("DOMContentLoaded",function(){

    var currentPage =
        window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();

    if(!currentPage){
        currentPage="index.html";
    }

    document.querySelectorAll(".menu a").forEach(function(link){

        var linkPage =
            link.getAttribute("href")
            .split("/")
            .pop()
            .toLowerCase();

        if(linkPage===currentPage){
            link.classList.add("active");
        }

    });


    loadRecords();

});


/* =====================================================
   LOAD RECORDS
===================================================== */

function loadRecords(){

    var container =
        document.getElementById("tableContainer");

    container.innerHTML =
        "<div class='loading'>Loading hardware records...</div>";


    fetch(API_URL+"?action=records")

    .then(function(response){

        if(!response.ok){
            throw new Error("Server error");
        }

        return response.json();

    })

    .then(function(result){

        if(result.status==="error"){

            throw new Error(
                result.message ||
                "Unable to load records"
            );

        }


        allRecords =
            result.data ||
            result.records ||
            [];


        populateBranchFilter();

        renderRecords();

    })

    .catch(function(error){

        console.error(error);

        container.innerHTML =
            "<div class='error'>" +
            "Unable to load hardware records.<br><br>" +
            "Please ensure the latest Code.gs is deployed as a Web App." +
            "</div>";

    });

}


/* =====================================================
   BRANCH FILTER
===================================================== */

function populateBranchFilter(){

    var select =
        document.getElementById("solFilter");

    var branches={};


    allRecords.forEach(function(row){

        if(row.solId){

            branches[row.solId] =
                row.branchName || "";

        }

    });


    Object.keys(branches)
    .sort()
    .forEach(function(sol){

        var option =
            document.createElement("option");

        option.value=sol;

        option.textContent =
            sol +
            " - " +
            branches[sol];

        select.appendChild(option);

    });

}


/* =====================================================
   FILTER EVENTS
===================================================== */

document.getElementById("search")
.addEventListener("input",renderRecords);

document.getElementById("solFilter")
.addEventListener("change",renderRecords);

document.getElementById("hardwareFilter")
.addEventListener("change",renderRecords);

document.getElementById("conditionFilter")
.addEventListener("change",renderRecords);


/* =====================================================
   RENDER
===================================================== */

function renderRecords(){

    var search =
        document.getElementById("search")
        .value
        .toLowerCase()
        .trim();

    var sol =
        document.getElementById("solFilter")
        .value;

    var hardware =
        document.getElementById("hardwareFilter")
        .value;

    var condition =
        document.getElementById("conditionFilter")
        .value;


    var filtered =
        allRecords.filter(function(row){

            var text =
                [
                    row.submissionId,
                    row.solId,
                    row.branchName,
                    row.hardwareType,
                    row.hardwareSubType,
                    row.make,
                    row.model,
                    row.serialNo,
                    row.condition,
                    row.remarks
                ]
                .join(" ")
                .toLowerCase();


            var searchOK =
                !search ||
                text.indexOf(search)!==-1;


            var solOK =
                !sol ||
                String(row.solId)===String(sol);


            var hardwareOK =
                !hardware ||
                String(row.hardwareType)===String(hardware);


            var conditionOK =
                !condition ||
                String(row.condition)
                .toUpperCase()===condition;


            return(
                searchOK &&
                solOK &&
                hardwareOK &&
                conditionOK
            );

        });


    document.getElementById("count")
        .innerText=filtered.length;


    if(filtered.length===0){

        document.getElementById("tableContainer")
        .innerHTML =
            "<div class='loading'>No records found.</div>";

        return;

    }


    var html="";

    html += "<div class='table-wrap'>";

    html += "<table>";

    html += "<thead>";

    html += "<tr>";

    html += "<th>Submission ID</th>";
    html += "<th>SOL ID</th>";
    html += "<th>Branch</th>";
    html += "<th>Hardware Type</th>";
    html += "<th>Sub Type</th>";
    html += "<th>Make</th>";
    html += "<th>Model</th>";
    html += "<th>Serial No</th>";
    html += "<th>Condition</th>";
    html += "<th>Remarks</th>";
    html += "<th>Action</th>";

    html += "</tr>";

    html += "</thead>";

    html += "<tbody>";


    filtered.forEach(function(row){

        var conditionClass =
            getConditionClass(row.condition);


        html += "<tr>";

        html += "<td>"+
            safe(row.submissionId)+
            "</td>";

        html += "<td>"+
            safe(row.solId)+
            "</td>";

        html += "<td>"+
            safe(row.branchName)+
            "</td>";

        html += "<td>"+
            safe(row.hardwareType)+
            "</td>";

        html += "<td>"+
            safe(row.hardwareSubType)+
            "</td>";

        html += "<td>"+
            safe(row.make)+
            "</td>";

        html += "<td>"+
            safe(row.model)+
            "</td>";

        html += "<td>"+
            safe(row.serialNo)+
            "</td>";

        html += "<td>";

        html += "<span class='condition "+
            conditionClass+
            "'>";

        html += safe(row.condition);

        html += "</span>";

        html += "</td>";

        html += "<td>"+
            safe(row.remarks)+
            "</td>";

        html += "<td>";

        html += "<div class='action'>";

        html +=
            "<button class='btn-edit' " +
            "onclick=\"editRecord('" +
            encodeURIComponent(row.submissionId) +
            "')\">Edit</button>";

        html +=
            "<button class='btn-delete' " +
            "onclick=\"deleteRecord('" +
            encodeURIComponent(row.submissionId) +
            "')\">Delete</button>";

        html += "</div>";

        html += "</td>";

        html += "</tr>";

    });


    html += "</tbody>";

    html += "</table>";

    html += "</div>";


    document.getElementById("tableContainer")
        .innerHTML=html;

}


/* =====================================================
   CONDITION CLASS
===================================================== */

function getConditionClass(condition){

    var c =
        String(condition || "")
        .toUpperCase();

    if(c==="WORKING"){
        return "working";
    }

    if(c==="NOT WORKING"){
        return "notworking";
    }

    if(c==="UNDER REPAIR"){
        return "repair";
    }

    if(c==="DAMAGED"){
        return "damaged";
    }

    return "";

}


/* =====================================================
   EDIT
===================================================== */

function editRecord(id){

    id =
        decodeURIComponent(id);

    window.location.href =
        "edit-hardware.html?id="+
        encodeURIComponent(id);

}


/* =====================================================
   DELETE
===================================================== */

function deleteRecord(id){

    id =
        decodeURIComponent(id);


    if(!confirm(
        "Are you sure you want to delete this hardware record?\n\n"+
        "Submission ID: "+id
    )){
        return;
    }


    var params =
        new URLSearchParams();

    params.append(
        "action",
        "delete"
    );

    params.append(
        "submissionId",
        id
    );


    fetch(API_URL,{
        method:"POST",
        body:params
    })

    .then(function(response){

        if(!response.ok){
            throw new Error("Server error");
        }

        return response.json();

    })

    .then(function(result){

        if(
            result.status==="success" ||
            result.success===true
        ){

            alert(
                result.message ||
                "Hardware deleted successfully."
            );

            loadRecords();

        }else{

            throw new Error(
                result.message ||
                "Delete failed."
            );

        }

    })

    .catch(function(error){

        console.error(error);

        alert(
            error.message ||
            "Unable to delete record."
        );

    });

}


/* =====================================================
   RESET FILTERS
===================================================== */

function resetFilters(){

    document.getElementById("search")
        .value="";

    document.getElementById("solFilter")
        .value="";

    document.getElementById("hardwareFilter")
        .value="";

    document.getElementById("conditionFilter")
        .value="";

    renderRecords();

}


/* =====================================================
   SAFE HTML
===================================================== */

function safe(value){

    if(value===null || value===undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
