<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hardware Records</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f5;color:#1f2937}
.sidebar{position:fixed;inset:0 auto 0 0;width:245px;background:linear-gradient(180deg,#006633,#003d1d);color:white;padding-bottom:55px}
.brand{padding:22px 18px;border-bottom:1px solid #ffffff22;display:flex;gap:12px;align-items:center}.brand i{font-size:24px;background:#ffffff18;padding:12px;border-radius:12px}.brand b{display:block}.brand small{opacity:.7}
nav{padding:16px 10px}nav a{display:block;color:#fff;text-decoration:none;padding:12px;border-radius:8px;font-size:13px;margin:3px 0}nav a:hover{background:#ffffff1f}
.foot{position:absolute;bottom:0;padding:12px 18px;font-size:10px;opacity:.65;border-top:1px solid #ffffff22;width:100%}
.main{margin-left:245px;min-height:100vh}.top{height:70px;background:white;border-bottom:1px solid #e1e7e3;padding:0 24px;display:flex;align-items:center;justify-content:space-between}.title{font-size:18px;font-weight:bold}.sub{font-size:11px;color:#777;margin-top:3px}
.content{padding:24px}.hero{background:linear-gradient(120deg,#006633,#00994d);color:#fff;padding:25px;border-radius:16px;margin-bottom:20px}.hero h1{margin:0 0 6px}.hero p{margin:0;opacity:.8}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid #e1e7e3;border-radius:14px}.card{padding:17px}.card small{color:#777}.num{font-size:24px;font-weight:bold;margin-top:5px}.panel{overflow:hidden;margin-bottom:20px}.head{padding:16px 18px;border-bottom:1px solid #e1e7e3;display:flex;justify-content:space-between;align-items:center}.body{padding:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.full{grid-column:1/-1}label{font-size:11px;font-weight:bold;display:block;margin-bottom:6px}input,select,textarea{width:100%;padding:10px;border:1px solid #d6ddd8;border-radius:8px;font-size:13px}textarea{min-height:80px}.branch{padding:10px;background:#edf9f1;color:#006633;border-radius:8px;font-size:12px;min-height:38px}
.actions{margin-top:18px;padding-top:16px;border-top:1px solid #e1e7e3;display:flex;gap:8px;justify-content:flex-end}.btn{border:0;border-radius:8px;padding:9px 13px;font-size:11px;font-weight:bold;cursor:pointer}.primary{background:#006633;color:white}.secondary{background:#edf1ef}.danger{background:#fff0ed;color:#b42318}.warning{background:#fff4df;color:#8a5700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px}th{background:#f5f8f6;padding:11px;text-align:left;white-space:nowrap}td{padding:10px;border-bottom:1px solid #edf0ef;white-space:nowrap}.badge{padding:4px 8px;border-radius:20px;font-size:9px;font-weight:bold}.w{background:#e6f7ec;color:#087a3b}.nw{background:#ffe9e5;color:#b42318}.r{background:#fff1dc;color:#a85d00}.d{background:#ffe4df;color:#a3261a}
.mobile{display:none}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.sidebar{transform:translateX(-245px);z-index:1000}.sidebar.open{transform:translateX(0)}.main{margin-left:0}.mobile{display:inline-block;border:0;background:none;font-size:20px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.cards{grid-template-columns:repeat(2,1fr)}.content{padding:13px}}@media(max-width:500px){.cards{grid-template-columns:1fr}}
@media print{.sidebar,.top,.no-print{display:none!important}.main{margin-left:0}.content{padding:0}}
</style></head>
<body><aside class="sidebar"><div class="brand"><i class="fa-solid fa-server"></i><div><b>MPGB Hardware</b><small>RO Jabalpur</small></div></div><nav><a class="" href="index.html">📊 Dashboard</a><a class="" href="add-hardware.html">➕ Add Hardware</a><a class="active" href="records.html">🗃️ Hardware Records</a><a class="" href="branch-summary.html">🏢 Branch-wise Summary</a><a class="" href="hardware-summary.html">📈 Hardware-wise Summary</a><a class="" href="reports.html">📄 Reports</a></nav><div class="foot">MPGB • RO Jabalpur<br>Hardware Asset Management</div></aside>
<main class="main"><header class="top"><div><button class="mobile" onclick="toggleMenu()">☰</button><span class="title">Hardware Records</span><div class="sub">Search, edit and delete hardware</div></div><b>RO Jabalpur</b></header><div class="content">
<div class="panel"><div class="head"><b>Hardware Records</b><div class="toolbar">
<input id="search" placeholder="Search..." oninput="filterData()"><select id="solFilter" onchange="filterData()"><option value="">All SOLs</option></select>
<select id="conditionFilter" onchange="filterData()"><option value="">All Conditions</option><option>WORKING</option><option>NOT WORKING</option><option>UNDER REPAIR</option><option>DAMAGED</option></select>
<button class="btn" onclick="load()">↻</button></div></div><div class="tablewrap" id="table">Loading...</div></div>
</div></main>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec';
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function badge(c){let x=String(c||'').toUpperCase();if(x==='WORKING')return '<span class="badge w">Working</span>';if(x==='UNDER REPAIR')return '<span class="badge r">Under Repair</span>';if(x==='DAMAGED')return '<span class="badge d">Damaged</span>';return '<span class="badge nw">'+esc(c)+'</span>';}
function toggleMenu(){document.querySelector('.sidebar').classList.toggle('open')}

let records=[];
async function init(){let d=await(await fetch(GAS_URL+'?action=getSOLList&_='+Date.now())).json();(d.data||[]).forEach(x=>{let o=document.createElement('option');o.value=x.solId;o.textContent=x.solId+' - '+x.branchName;solFilter.appendChild(o)});load()}
async function load(){let d=await(await fetch(GAS_URL+'?action=recent&_='+Date.now())).json();records=d.data||[];filterData()}
function filterData(){let q=search.value.toLowerCase(),s=solFilter.value,c=conditionFilter.value;render(records.filter(x=>[x.submissionId,x.solId,x.branchName,x.hardwareType,x.make,x.model,x.serialNo,x.remarks].join(' ').toLowerCase().includes(q)&&(!s||x.solId===s)&&(!c||x.condition===c)))}
function render(rows){let h='<table><tr><th>Date</th><th>ID</th><th>SOL</th><th>Branch</th><th>Hardware</th><th>Make</th><th>Model</th><th>Serial</th><th>Condition</th><th>Action</th></tr>';if(!rows.length)h+='<tr><td colspan="10">No records found.</td></tr>';rows.forEach(x=>h+=`<tr><td>${esc(x.timestamp)}</td><td>${esc(x.submissionId)}</td><td>${esc(x.solId)}</td><td>${esc(x.branchName)}</td><td>${esc(x.hardwareType)}</td><td>${esc(x.make)}</td><td>${esc(x.model)}</td><td>${esc(x.serialNo)}</td><td>${badge(x.condition)}</td><td><button class="btn warning" onclick="edit('${encodeURIComponent(x.submissionId)}')">Edit</button> <button class="btn danger" onclick="del('${encodeURIComponent(x.submissionId)}')">Delete</button></td></tr>`);table.innerHTML=h+'</table>'}
function edit(id){let r=records.find(x=>x.submissionId===decodeURIComponent(id));localStorage.setItem('editHardwareRecord',JSON.stringify(r));location.href='edit-hardware.html'}
async function del(id){id=decodeURIComponent(id);if(!confirm('Delete this record?'))return;let d=await(await fetch(GAS_URL+'?action=delete&submissionId='+encodeURIComponent(id))).json();if(d.status!=='success')return alert(d.message);load()}
init();
</script></body></html>
