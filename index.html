<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Hardware Inventory Management</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7f6;
    color: #222;
}

/* ================= HEADER ================= */

.header {
    background: linear-gradient(135deg, #006633, #00994d);
    color: #fff;
    padding: 18px 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.header h1 {
    margin: 0;
    font-size: 25px;
}

.header p {
    margin: 5px 0 0;
    font-size: 13px;
    opacity: .9;
}

/* ================= CONTAINER ================= */

.container {
    max-width: 1250px;
    margin: 25px auto;
    padding: 0 18px;
}

/* ================= DASHBOARD ================= */

.dashboard {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.stat {
    background: #fff;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

.stat-title {
    color: #777;
    font-size: 13px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 30px;
    font-weight: bold;
    color: #006633;
}

/* ================= CARD ================= */

.card {
    background: #fff;
    border-radius: 12px;
    padding: 25px;
    margin-bottom: 20px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
}

.card-title {
    color: #006633;
    margin: 0 0 20px;
    font-size: 21px;
}

/* ================= FORM ================= */

.form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.full {
    grid-column: 1 / -1;
}

label {
    font-weight: 600;
    margin-bottom: 7px;
    font-size: 14px;
}

.required {
    color: red;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #ccc;
    border-radius: 7px;
    font-size: 14px;
    background: #fff;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #006633;
    box-shadow: 0 0 0 2px rgba(0,102,51,.08);
}

textarea {
    min-height: 90px;
    resize: vertical;
}

/* ================= BUTTONS ================= */

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 12px 25px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.save-btn {
    background: #006633;
    color: #fff;
}

.save-btn:hover {
    background: #004d26;
}

.save-btn:disabled {
    background: #999;
    cursor: not-allowed;
}

.clear-btn {
    background: #666;
    color: #fff;
}

.clear-btn:hover {
    background: #444;
}

/* ================= TABLE ================= */

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 1050px;
    border-collapse: collapse;
}

th {
    background: #006633;
    color: #fff;
    padding: 11px;
    text-align: left;
    white-space: nowrap;
    font-size: 13px;
}

td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    font-size: 13px;
    white-space: nowrap;
}

tr:hover td {
    background: #f5faf7;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #888;
}

/* ================= BADGES ================= */

.badge {
    display: inline-block;
    padding: 4px 9px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
}

.badge-working {
    background: #dff5e6;
    color: #176b32;
}

.badge-notworking {
    background: #ffe1e1;
    color: #a00000;
}

.badge-other {
    background: #eee;
    color: #555;
}

/* ================= LOADING ================= */

.loading {
    display: none;
    position: fixed;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    background: rgba(0,0,0,.45);
    z-index: 99999;
    align-items: center;
    justify-content: center;
}

.loading-box {
    background: #fff;
    border-radius: 10px;
    padding: 25px 35px;
    text-align: center;
    box-shadow: 0 5px 30px rgba(0,0,0,.3);
}

.spinner {
    width: 38px;
    height: 38px;
    border: 4px solid #ddd;
    border-top: 4px solid #006633;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 12px;
}

@keyframes spin {
    100% {
        transform: rotate(360deg);
    }
}

/* ================= MESSAGE ================= */

.message {
    display: none;
    margin-bottom: 15px;
    padding: 12px 15px;
    border-radius: 7px;
    font-size: 14px;
}

.message.success {
    background: #dff5e6;
    color: #176b32;
}

.message.error {
    background: #ffe1e1;
    color: #a00000;
}

/* ================= MOBILE ================= */

@media(max-width:800px) {

    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

}

@media(max-width:500px) {

    .dashboard {
        grid-template-columns: 1fr;
    }

    .header {
        padding: 17px;
    }

    .header h1 {
        font-size: 20px;
    }

    .card {
        padding: 17px;
    }

    .buttons {
        flex-direction: column;
    }

    button {
        width: 100%;
    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div class="header">

    <h1>
        Hardware Inventory Management
    </h1>

    <p>
        Hardware Entry Portal
    </p>

</div>



<div class="container">


<!-- ================= DASHBOARD ================= -->

<div class="dashboard">

    <div class="stat">

        <div class="stat-title">
            Total Hardware
        </div>

        <div
            class="stat-value"
            id="total">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Working
        </div>

        <div
            class="stat-value"
            id="working">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Not Working
        </div>

        <div
            class="stat-value"
            id="notWorking">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            Other
        </div>

        <div
            class="stat-value"
            id="other">

            0

        </div>

    </div>

</div>



<!-- ================= MESSAGE ================= -->

<div
    id="message"
    class="message">
</div>



<!-- ================= HARDWARE FORM ================= -->

<div class="card">

    <h2 class="card-title">
        Add Hardware
    </h2>


    <div class="form-grid">


        <!-- SOL ID -->

        <div class="form-group">

            <label>
                SOL ID
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="solId"
                placeholder="Enter SOL ID"
                autocomplete="off">

        </div>


        <!-- BRANCH -->

        <div class="form-group">

            <label>
                Branch Name
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="branchName"
                placeholder="Enter Branch Name"
                autocomplete="off">

        </div>


        <!-- HARDWARE TYPE -->

        <div class="form-group">

            <label>
                Hardware Type
                <span class="required">*</span>
            </label>

            <select id="hardwareType">

                <option value="">
                    Select Hardware Type
                </option>

                <option value="CPU">
                    CPU
                </option>

                <option value="Monitor">
                    Monitor
                </option>

                <option value="Passbook Printer">
                    Passbook Printer
                </option>

                <option value="Laser Printer">
                    Laser Printer
                </option>

                <option value="Scanner">
                    Scanner
                </option>

                <option value="CTS Machine">
                    CTS Machine
                </option>

                <option value="CCTV Monitor">
                    CCTV Monitor
                </option>

                <option value="UPS">
                    UPS
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- SUB TYPE -->

        <div class="form-group">

            <label>
                Hardware Sub Type
            </label>

            <input
                type="text"
                id="hardwareSubType"
                placeholder="Enter Hardware Sub Type">

        </div>


        <!-- MAKE -->

        <div class="form-group">

            <label>
                Make
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="make"
                placeholder="HP / Dell / Canon etc.">

        </div>


        <!-- MODEL -->

        <div class="form-group">

            <label>
                Model
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="model"
                placeholder="Enter Model">

        </div>


        <!-- SERIAL -->

        <div class="form-group">

            <label>
                Serial No.
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="serialNo"
                placeholder="Enter Serial Number">

        </div>


        <!-- CONDITION -->

        <div class="form-group">

            <label>
                Condition
                <span class="required">*</span>
            </label>

            <select id="condition">

                <option value="">
                    Select Condition
                </option>

                <option value="WORKING">
                    WORKING
                </option>

                <option value="NOT WORKING">
                    NOT WORKING
                </option>

                <option value="DAMAGED">
                    DAMAGED
                </option>

                <option value="UNDER REPAIR">
                    UNDER REPAIR
                </option>

                <option value="SCRAP">
                    SCRAP
                </option>

                <option value="OTHER">
                    OTHER
                </option>

            </select>

        </div>


        <!-- REMARKS -->

        <div class="form-group full">

            <label>
                Remarks
            </label>

            <textarea
                id="remarks"
                placeholder="Enter remarks if required"></textarea>

        </div>


    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            type="button"
            class="save-btn"
            id="saveButton"
            onclick="saveHardware()">

            💾 Save Hardware

        </button>


        <button
            type="button"
            class="clear-btn"
            onclick="clearForm()">

            ↻ Clear

        </button>

    </div>

</div>



<!-- ================= RECENT HARDWARE ================= -->

<div class="card">

    <h2 class="card-title">
        Recently Added Hardware
    </h2>


    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>
                        Submission ID
                    </th>

                    <th>
                        SOL ID
                    </th>

                    <th>
                        Branch Name
                    </th>

                    <th>
                        Hardware Type
                    </th>

                    <th>
                        Sub Type
                    </th>

                    <th>
                        Make
                    </th>

                    <th>
                        Model
                    </th>

                    <th>
                        Serial No
                    </th>

                    <th>
                        Condition
                    </th>

                    <th>
                        Remarks
                    </th>

                </tr>

            </thead>


            <tbody id="recentBody">

                <tr>

                    <td
                        colspan="10"
                        class="empty">

                        Loading...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>


</div>



<!-- ================= LOADING ================= -->

<div
    class="loading"
    id="loading">

    <div class="loading-box">

        <div class="spinner"></div>

        <div id="loadingText">
            Saving hardware...
        </div>

    </div>

</div>



<script>


/****************************************************
 * APPS SCRIPT WEB APP URL
 *
 * IMPORTANT:
 * Replace this with your actual Apps Script
 * Web App URL ending in /exec
 ****************************************************/

var GAS_URL =
    "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";


/****************************************************
 * CHECK API
 ****************************************************/

function apiConfigured() {

    return (
        GAS_URL &&
        GAS_URL.indexOf(
            "PASTE_YOUR"
        ) === -1
    );

}


/****************************************************
 * SHOW MESSAGE
 ****************************************************/

function showMessage(
    text,
    type
) {

    var box =
        document.getElementById(
            "message"
        );

    box.innerText =
        text;

    box.className =
        "message " +
        type;

    box.style.display =
        "block";


    setTimeout(
        function() {

            box.style.display =
                "none";

        },
        5000
    );

}


/****************************************************
 * LOADING
 ****************************************************/

function showLoading(
    text
) {

    document.getElementById(
        "loadingText"
    ).innerText =
        text ||
        "Please wait...";


    document.getElementById(
        "loading"
    ).style.display =
        "flex";

}


function hideLoading() {

    document.getElementById(
        "loading"
    ).style.display =
        "none";

}


/****************************************************
 * SAVE HARDWARE
 *
 * ONE CLICK = ONE HARDWARE ITEM
 * ONE ITEM = ONE ROW
 ****************************************************/

function saveHardware() {


    if (!apiConfigured()) {

        alert(
            "Apps Script Web App URL is not configured."
        );

        return;

    }


    var solId =
        document
        .getElementById(
            "solId"
        )
        .value
        .trim();


    var branchName =
        document
        .getElementById(
            "branchName"
        )
        .value
        .trim();


    var hardwareType =
        document
        .getElementById(
            "hardwareType"
        )
        .value;


    var hardwareSubType =
        document
        .getElementById(
            "hardwareSubType"
        )
        .value
        .trim();


    var make =
        document
        .getElementById(
            "make"
        )
        .value
        .trim();


    var model =
        document
        .getElementById(
            "model"
        )
        .value
        .trim();


    var serialNo =
        document
        .getElementById(
            "serialNo"
        )
        .value
        .trim();


    var condition =
        document
        .getElementById(
            "condition"
        )
        .value;


    var remarks =
        document
        .getElementById(
            "remarks"
        )
        .value
        .trim();


    /* VALIDATION */

    if (!solId) {

        alert(
            "Please enter SOL ID."
        );

        document
        .getElementById(
            "solId"
        )
        .focus();

        return;

    }


    if (!branchName) {

        alert(
            "Please enter Branch Name."
        );

        return;

    }


    if (!hardwareType) {

        alert(
            "Please select Hardware Type."
        );

        return;

    }


    if (!make) {

        alert(
            "Please enter Make."
        );

        return;

    }


    if (!model) {

        alert(
            "Please enter Model."
        );

        return;

    }


    if (!serialNo) {

        alert(
            "Please enter Serial No."
        );

        return;

    }


    if (!condition) {

        alert(
            "Please select Condition."
        );

        return;

    }


    /************************************************
     * PARAMETERS
     ************************************************/

    var params =
        new URLSearchParams();


    params.append(
        "action",
        "save"
    );

    params.append(
        "solId",
        solId
    );

    params.append(
        "branchName",
        branchName
    );

    params.append(
        "hardwareType",
        hardwareType
    );

    params.append(
        "hardwareSubType",
        hardwareSubType
    );

    params.append(
        "make",
        make
    );

    params.append(
        "model",
        model
    );

    params.append(
        "serialNo",
        serialNo
    );

    params.append(
        "condition",
        condition
    );

    params.append(
        "remarks",
        remarks
    );


    /************************************************
     * BUTTON
     ************************************************/

    var saveButton =
        document.getElementById(
            "saveButton"
        );


    saveButton.disabled =
        true;

    saveButton.innerText =
        "Saving...";


    showLoading(
        "Saving hardware..."
    );


    /************************************************
     * SEND TO APPS SCRIPT
     ************************************************/

    fetch(
        GAS_URL +
        "?" +
        params.toString()
    )

    .then(
        function(response) {

            if (!response.ok) {

                throw new Error(
                    "Server returned HTTP " +
                    response.status
                );

            }

            return response.json();

        }
    )

    .then(
        function(result) {


            hideLoading();


            saveButton.disabled =
                false;

            saveButton.innerText =
                "💾 Save Hardware";


            if (
                result &&
                result.status ===
                "success"
            ) {


                showMessage(
                    "Hardware saved successfully. Submission ID: " +
                    result.submissionId,
                    "success"
                );


                alert(
                    "✅ Hardware Saved Successfully\n\n" +
                    "Submission ID: " +
                    result.submissionId
                );


                /*
                 * Clear for next item
                 */

                clearForm();


                /*
                 * Refresh
                 */

                loadDashboard();

                loadRecent();

            }

            else {

                showMessage(
                    result &&
                    result.message
                        ? result.message
                        : "Save failed.",
                    "error"
                );


                alert(
                    "❌ Save Failed\n\n" +
                    (
                        result &&
                        result.message
                            ? result.message
                            : "Unknown error."
                    )
                );

            }

        }
    )

    .catch(
        function(error) {


            hideLoading();


            saveButton.disabled =
                false;

            saveButton.innerText =
                "💾 Save Hardware";


            console.error(
                "SAVE ERROR:",
                error
            );


            alert(
                "❌ Saving Error\n\n" +
                error.message
            );

        }
    );

}


/****************************************************
 * CLEAR FORM
 ****************************************************/

function clearForm() {


    document
    .getElementById(
        "solId"
    )
    .value = "";


    document
    .getElementById(
        "branchName"
    )
    .value = "";


    document
    .getElementById(
        "hardwareType"
    )
    .value = "";


    document
    .getElementById(
        "hardwareSubType"
    )
    .value = "";


    document
    .getElementById(
        "make"
    )
    .value = "";


    document
    .getElementById(
        "model"
    )
    .value = "";


    document
    .getElementById(
        "serialNo"
    )
    .value = "";


    document
    .getElementById(
        "condition"
    )
    .value = "";


    document
    .getElementById(
        "remarks"
    )
    .value = "";


    document
    .getElementById(
        "solId"
    )
    .focus();

}


/****************************************************
 * DASHBOARD
 ****************************************************/

function loadDashboard() {


    if (!apiConfigured()) {
        return;
    }


    fetch(
        GAS_URL +
        "?action=dashboard"
    )

    .then(
        function(response) {

            return response.json();

        }
    )

    .then(
        function(result) {


            if (
                !result ||
                result.status !==
                "success"
            ) {

                return;

            }


            document
            .getElementById(
                "total"
            )
            .innerText =
                result.total || 0;


            document
            .getElementById(
                "working"
            )
            .innerText =
                result.working || 0;


            document
            .getElementById(
                "notWorking"
            )
            .innerText =
                result.notWorking || 0;


            document
            .getElementById(
                "other"
            )
            .innerText =
                result.other || 0;

        }
    )

    .catch(
        function(error) {

            console.log(
                "Dashboard error:",
                error
            );

        }
    );

}


/****************************************************
 * RECENT HARDWARE
 ****************************************************/

function loadRecent() {


    if (!apiConfigured()) {
        return;
    }


    fetch(
        GAS_URL +
        "?action=recent"
    )

    .then(
        function(response) {

            return response.json();

        }
    )

    .then(
        function(result) {


            var body =
                document
                .getElementById(
                    "recentBody"
                );


            if (
                !result ||
                result.status !==
                "success"
            ) {

                body.innerHTML =
                    "<tr>" +
                    "<td colspan='10' class='empty'>" +
                    "Unable to load data." +
                    "</td>" +
                    "</tr>";

                return;

            }


            var data =
                result.data || [];


            if (
                data.length === 0
            ) {

                body.innerHTML =
                    "<tr>" +
                    "<td colspan='10' class='empty'>" +
                    "No hardware records found." +
                    "</td>" +
                    "</tr>";

                return;

            }


            var html = "";


            for (
                var i = 0;
                i < data.length;
                i++
            ) {


                var row =
                    data[i];


                var badge =
                    "badge-other";


                var condition =
                    String(
                        row.condition || ""
                    )
                    .toUpperCase();


                if (
                    condition ===
                    "WORKING"
                ) {

                    badge =
                        "badge-working";

                }

                else if (
                    condition ===
                    "NOT WORKING"
                ) {

                    badge =
                        "badge-notworking";

                }


                html +=

                    "<tr>" +

                    "<td>" +
                    escapeHtml(
                        row.submissionId
                    ) +
                    "</td>" +

                    "<td>" +
                    escapeHtml(
                        row.solId
                    ) +
                    "</td>" +

                    "<td>" +
                    escapeHtml(
                        row.branchName
                    ) +
                    "</td>" +

                    "<td>" +
                    escapeHtml(
                        row.hardwareType
                    ) +
                    "</td>" +

                    "<td>" +
                    escapeHtml(
                        row.hardwareSubType
                    ) +
                    "</td>" +

                    "<td>" +
                    escapeHtml(
                        row.make
                    ) +
                    "</td>" +

                    "<td>" +
                    escapeHtml(
                        row.model
                    ) +
                    "</td>" +

                    "<td>" +
                    escapeHtml(
                        row.serialNo
                    ) +
                    "</td>" +

                    "<td>" +

                    "<span class='badge " +
                    badge +
                    "'>" +

                    escapeHtml(
                        row.condition
                    ) +

                    "</span>" +

                    "</td>" +

                    "<td>" +
                    escapeHtml(
                        row.remarks
                    ) +
                    "</td>" +

                    "</tr>";

            }


            body.innerHTML =
                html;

        }
    )

    .catch(
        function(error) {

            console.log(
                "Recent records error:",
                error
            );

        }
    );

}


/****************************************************
 * ESCAPE HTML
 ****************************************************/

function escapeHtml(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/****************************************************
 * PAGE LOAD
 ****************************************************/

window.addEventListener(
    "load",
    function() {

        loadDashboard();

        loadRecent();

    }
);

</script>
