<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Hardware - MPGB</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f7f6;
    color:#222;
}

/* ================= SIDEBAR ================= */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:245px;
    height:100vh;
    background:#006400;
    color:#fff;
    padding:22px 14px;
    z-index:1000;
    box-shadow:3px 0 12px rgba(0,0,0,.12);
}

.logo{
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:28px;
}

.logo small{
    display:block;
    font-size:11px;
    font-weight:normal;
    margin-top:5px;
}

.menu a{
    display:flex;
    align-items:center;
    gap:12px;
    color:#fff;
    text-decoration:none;
    padding:13px 14px;
    border-radius:9px;
    margin:5px 0;
    font-size:14px;
    transition:.2s;
}

.menu a:hover{
    background:#00823b;
}

.menu a.active{
    background:#00823b;
    box-shadow:inset 4px 0 #fff;
}

.menu i{
    width:22px;
    text-align:center;
    font-style:normal;
    font-size:18px;
}

/* ================= MAIN ================= */

.main{
    margin-left:245px;
    padding:25px;
}

.header{
    background:#fff;
    border-radius:14px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.header h1{
    color:#006400;
    font-size:27px;
}

.header p{
    color:#666;
    margin-top:7px;
}

/* ================= SELECT RECORD ================= */

.search-card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.search-row{
    display:flex;
    gap:12px;
}

.search-row input{
    flex:1;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #d4dcd7;
    border-radius:8px;
    padding:11px 12px;
    font-size:14px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#00823b;
}

.search-btn{
    background:#006400;
    color:#fff;
    border:0;
    border-radius:8px;
    padding:0 22px;
    font-weight:bold;
    cursor:pointer;
}

.search-btn:hover{
    background:#00823b;
}

/* ================= FORM ================= */

.form-card{
    background:#fff;
    border-radius:14px;
    padding:25px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.form-title{
    color:#006400;
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
    color:#444;
}

.required{
    color:#d00000;
}

.branch-info{
    margin-top:7px;
    color:#00823b;
    font-size:12px;
    font-weight:bold;
}

.readonly{
    background:#f1f4f2;
}

/* ================= BUTTONS ================= */

.buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 24px;
    font-weight:bold;
    cursor:pointer;
}

.btn-update{
    background:#006400;
    color:white;
}

.btn-update:hover{
    background:#00823b;
}

.btn-cancel{
    background:#e9eeeb;
    color:#333;
}

.btn-delete{
    background:#d00000;
    color:#fff;
}

.btn-delete:hover{
    background:#a90000;
}

/* ================= MESSAGE ================= */

.message{
    display:none;
    padding:13px 15px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:14px;
}

.message.success{
    display:block;
    background:#e6f7ec;
    color:#08752d;
    border:1px solid #a9dfba;
}

.message.error{
    display:block;
    background:#ffe8e8;
    color:#b00020;
    border:1px solid #f0b5b5;
}

.loading{
    padding:25px;
    text-align:center;
    color:#777;
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

    .sidebar{
        width:70px;
        padding:15px 8px;
    }

    .logo{
        font-size:0;
    }

    .logo:before{
        content:"MP";
        font-size:20px;
    }

    .logo small,
    .menu span{
        display:none;
    }

    .menu a{
        justify-content:center;
        padding:12px;
    }

    .main{
        margin-left:70px;
        padding:15px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

}

@media(max-width:500px){

    .main{
        padding:10px;
    }

    .search-row{
        flex-direction:column;
    }

    .search-btn{
        padding:12px;
    }

    .form-card{
        padding:17px;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }

}

</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar">

    <div class="logo">
        MPGB
        <small>Hardware Management</small>
    </div>

    <nav class="menu">

        <a href="index.html">
            <i>⌂</i>
            <span>Dashboard</span>
        </a>

        <a href="add-hardware.html">
            <i>＋</i>
            <span>Add Hardware</span>
        </a>

        <a href="records.html">
            <i>▣</i>
            <span>Hardware Records</span>
        </a>

        <a href="edit-hardware.html">
            <i>✎</i>
            <span>Edit / Update</span>
        </a>

        <a href="branch-summary.html">
            <i>▥</i>
            <span>Branch Summary</span>
        </a>

        <a href="hardware-summary.html">
            <i>◈</i>
            <span>Hardware Summary</span>
        </a>

        <a href="reports.html">
            <i>▤</i>
            <span>Reports</span>
        </a>

    </nav>

</aside>


<!-- ================= MAIN ================= -->

<main class="main">

    <div class="header">

        <h1>Edit / Update Hardware</h1>

        <p>
            Modify existing hardware records
        </p>

    </div>


    <div id="message" class="message"></div>


    <!-- ================= SEARCH ================= -->

    <div class="search-card">

        <div class="search-row">

            <input
                type="text"
                id="submissionSearch"
                placeholder="Enter Submission ID"
            >

            <button
                type="button"
                class="search-btn"
                onclick="findRecord()">

                Load Record

            </button>

        </div>

    </div>


    <!-- ================= FORM ================= -->

    <div class="form-card">

        <div class="form-title">
            Hardware Details
        </div>


        <div id="loading"
             class="loading">

            Select a record to edit.

        </div>


        <form id="editForm"
              style="display:none;">

            <div class="form-grid">

                <!-- SUBMISSION ID -->

                <div class="field">

                    <label>
                        Submission ID
                    </label>

                    <input
                        type="text"
                        id="submissionId"
                        name="submissionId"
                        class="readonly"
                        readonly
                    >

                </div>


                <!-- SOL ID -->

                <div class="field">

                    <label>
                        SOL ID <span class="required">*</span>
                    </label>

                    <select
                        id="solId"
                        name="solId"
                        required>

                        <option value="">
                            Loading branches...
                        </option>

                    </select>

                    <div
                        id="branchInfo"
                        class="branch-info">
                    </div>

                </div>


                <!-- HARDWARE TYPE -->

                <div class="field">

                    <label>
                        Hardware Type <span class="required">*</span>
                    </label>

                    <select
                        id="hardwareType"
                        name="hardwareType"
                        required>

                        <option value="">
                            Select Hardware Type
                        </option>

                        <option value="CPU">
                            CPU
                        </option>

                        <option value="Monitor">
                            Monitor
                        </option>

                        <option value="Passbook Printer">
                            Passbook Printer
                        </option>

                        <option value="Laser Printer">
                            Laser Printer
                        </option>

                        <option value="Scanner">
                            Scanner
                        </option>

                        <option value="CTS Machine">
                            CTS Machine
                        </option>

                        <option value="CCTV Monitor">
                            CCTV Monitor
                        </option>

                        <option value="Biometric Device">
                            Biometric Device
                        </option>

                        <option value="UPS">
                            UPS
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- SUB TYPE -->

                <div class="field">

                    <label>
                        Hardware Sub Type
                    </label>

                    <input
                        type="text"
                        id="hardwareSubType"
                        name="hardwareSubType"
                    >

                </div>


                <!-- MAKE -->

                <div class="field">

                    <label>
                        Make
                    </label>

                    <input
                        type="text"
                        id="make"
                        name="make"
                    >

                </div>


                <!-- MODEL -->

                <div class="field">

                    <label>
                        Model
                    </label>

                    <input
                        type="text"
                        id="model"
                        name="model"
                    >

                </div>


                <!-- SERIAL -->

                <div class="field">

                    <label>
                        Serial No.</label>

                    <input
                        type="text"
                        id="serialNo"
                        name="serialNo"
                    >

                </div>


                <!-- CONDITION -->

                <div class="field">

                    <label>
                        Condition <span class="required">*</span>
                    </label>

                    <select
                        id="condition"
                        name="condition"
                        required>

                        <option value="">
                            Select Condition
                        </option>

                        <option value="WORKING">
                            WORKING
                        </option>

                        <option value="NOT WORKING">
                            NOT WORKING
                        </option>

                        <option value="UNDER REPAIR">
                            UNDER REPAIR
                        </option>

                        <option value="DAMAGED">
                            DAMAGED
                        </option>

                    </select>

                </div>


                <!-- REMARKS -->

                <div class="field full">

                    <label>
                        Remarks
                    </label>

                    <textarea
                        id="remarks"
                        name="remarks"
                    ></textarea>

                </div>

            </div>


            <div class="buttons">

                <button
                    type="submit"
                    class="btn-update"
                    id="updateBtn">

                    Update Hardware

                </button>


                <button
                    type="button"
                    class="btn-delete"
                    onclick="deleteCurrentRecord()">

                    Delete

                </button>


                <button
                    type="button"
                    class="btn-cancel"
                    onclick="window.location.href='records.html'">

                    Cancel

                </button>

            </div>

        </form>

    </div>

</main>


<script>

/* =====================================================
   API
===================================================== */

var API_URL =
"https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec";


var currentRecord=null;


/* =====================================================
   ACTIVE SIDEBAR
===================================================== */

document.addEventListener("DOMContentLoaded",function(){

    var currentPage =
        window.location.pathname
        .split("/")
        .pop()
        .toLowerCase();

    if(!currentPage){
        currentPage="index.html";
    }

    document.querySelectorAll(".menu a")
    .forEach(function(link){

        var linkPage =
            link.getAttribute("href")
            .split("/")
            .pop()
            .toLowerCase();

        if(linkPage===currentPage){

            link.classList.add("active");

        }

    });


    loadBranches();


    /*
     * If opened from Records page:
     *
     * edit-hardware.html?id=SUBMISSION_ID
     */

    var params =
        new URLSearchParams(
            window.location.search
        );

    var id =
        params.get("id");

    if(id){

        document.getElementById(
            "submissionSearch"
        ).value=id;

        setTimeout(function(){

            findRecord();

        },500);

    }

});


/* =====================================================
   LOAD BRANCHES
===================================================== */

function loadBranches(){

    var select =
        document.getElementById("solId");

    fetch(API_URL+"?action=getSOLList")

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "Unable to load branches"
            );

        }

        return response.json();

    })

    .then(function(result){

        var branches =
            result.data ||
            result.branches ||
            [];

        select.innerHTML =
            '<option value="">Select SOL / Branch</option>';


        branches.forEach(function(branch){

            var option =
                document.createElement("option");

            option.value =
                branch.solId;

            option.textContent =
                branch.solId +
                " - " +
                branch.branchName;

            option.setAttribute(
                "data-branch",
                branch.branchName
            );

            select.appendChild(option);

        });

    })

    .catch(function(error){

        console.error(error);

        select.innerHTML =
            '<option value="">Unable to load branches</option>';

    });

}


/* =====================================================
   FIND RECORD
===================================================== */

function findRecord(){

    var id =
        document.getElementById(
            "submissionSearch"
        ).value.trim();


    if(!id){

        showMessage(
            "Please enter Submission ID.",
            "error"
        );

        return;

    }


    document.getElementById(
        "loading"
    ).innerText =
        "Loading record...";


    document.getElementById(
        "editForm"
    ).style.display="none";


    fetch(API_URL+"?action=records")

    .then(function(response){

        if(!response.ok){

            throw new Error(
                "Unable to connect to server"
            );

        }

        return response.json();

    })

    .then(function(result){

        var records =
            result.data ||
            result.records ||
            [];


        var found =
            records.find(function(row){

                return String(
                    row.submissionId
                ).trim() === String(id).trim();

            });


        if(!found){

            throw new Error(
                "Hardware record not found."
            );

        }


        currentRecord=found;

        fillForm(found);

    })

    .catch(function(error){

        console.error(error);

        document.getElementById(
            "loading"
        ).innerText =
            "Record not found.";

        showMessage(
            error.message ||
            "Unable to load record.",
            "error"
        );

    });

}


/* =====================================================
   FILL FORM
===================================================== */

function fillForm(row){

    document.getElementById(
        "loading"
    ).style.display="none";


    document.getElementById(
        "editForm"
    ).style.display="block";


    document.getElementById(
        "submissionId"
    ).value =
        row.submissionId || "";


    setSelectValue(
        "solId",
        row.solId
    );


    setSelectValue(
        "hardwareType",
        row.hardwareType
    );


    document.getElementById(
        "hardwareSubType"
    ).value =
        row.hardwareSubType || "";


    document.getElementById(
        "make"
    ).value =
        row.make || "";


    document.getElementById(
        "model"
    ).value =
        row.model || "";


    document.getElementById(
        "serialNo"
    ).value =
        row.serialNo || "";


    setSelectValue(
        "condition",
        row.condition
    );


    document.getElementById(
        "remarks"
    ).value =
        row.remarks || "";


    updateBranchInfo();

}


/* =====================================================
   SELECT VALUE
===================================================== */

function setSelectValue(id,value){

    var select =
        document.getElementById(id);

    value =
        String(value || "");


    for(
        var i=0;
        i<select.options.length;
        i++
    ){

        if(
            String(
                select.options[i].value
            ).toUpperCase() ===
            value.toUpperCase()
        ){

            select.selectedIndex=i;

            return;

        }

    }

}


/* =====================================================
   BRANCH INFO
===================================================== */

document.getElementById("solId")
.addEventListener(
    "change",
    updateBranchInfo
);


function updateBranchInfo(){

    var select =
        document.getElementById("solId");

    var option =
        select.options[
            select.selectedIndex
        ];


    var branch =
        option ?
        option.getAttribute(
            "data-branch"
        ) :
        "";


    document.getElementById(
        "branchInfo"
    ).innerText =
        branch ?
        "Branch: " + branch :
        "";

}


/* =====================================================
   UPDATE
===================================================== */

document.getElementById("editForm")
.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        var btn =
            document.getElementById(
                "updateBtn"
            );


        btn.disabled=true;

        btn.innerText="Updating...";


        var formData =
            new FormData(this);


        var params =
            new URLSearchParams();


        params.append(
            "action",
            "update"
        );


        formData.forEach(
            function(value,key){

                params.append(
                    key,
                    value
                );

            }
        );


        fetch(API_URL,{
            method:"POST",
            body:params
        })

        .then(function(response){

            if(!response.ok){

                throw new Error(
                    "Server error"
                );

            }

            return response.json();

        })

        .then(function(result){

            if(
                result.status==="success" ||
                result.success===true
            ){

                showMessage(
                    result.message ||
                    "Hardware updated successfully.",
                    "success"
                );

                currentRecord=null;

            }else{

                throw new Error(
                    result.message ||
                    "Update failed."
                );

            }

        })

        .catch(function(error){

            console.error(error);

            showMessage(
                error.message ||
                "Unable to update record.",
                "error"
            );

        })

        .finally(function(){

            btn.disabled=false;

            btn.innerText=
                "Update Hardware";

        });

    }
);


/* =====================================================
   DELETE CURRENT RECORD
===================================================== */

function deleteCurrentRecord(){

    var id =
        document.getElementById(
            "submissionId"
        ).value.trim();


    if(!id){

        showMessage(
            "No record selected.",
            "error"
        );

        return;

    }


    if(!confirm(
        "Are you sure you want to delete this record?\n\n"+
        "Submission ID: "+id
    )){

        return;

    }


    var params =
        new URLSearchParams();


    params.append(
        "action",
        "delete"
    );


    params.append(
        "submissionId",
        id
    );


    fetch(API_URL,{
        method:"POST",
        body:params
    })

    .then(function(response){

        return response.json();

    })

    .then(function(result){

        if(
            result.status==="success" ||
            result.success===true
        ){

            alert(
                result.message ||
                "Hardware deleted successfully."
            );

            window.location.href=
                "records.html";

        }else{

            throw new Error(
                result.message ||
                "Delete failed."
            );

        }

    })

    .catch(function(error){

        console.error(error);

        showMessage(
            error.message ||
            "Unable to delete record.",
            "error"
        );

    });

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

    var box =
        document.getElementById(
            "message"
        );

    box.className =
        "message " + type;

    box.innerText=text;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

</script>

</body>
</html>
