<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MPGB - Edit Hardware</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f4f7f5;color:#222}

.sidebar{
position:fixed;left:0;top:0;width:245px;height:100vh;
background:#006400;color:white;padding:22px 14px;
box-shadow:3px 0 12px rgba(0,0,0,.12)
}

.logo{text-align:center;font-size:24px;font-weight:bold;margin-bottom:28px}
.logo small{display:block;font-size:11px;font-weight:normal;margin-top:5px}

.menu a{
display:flex;align-items:center;gap:12px;color:white;
text-decoration:none;padding:13px 14px;border-radius:9px;
margin:5px 0;font-size:14px
}

.menu a:hover,.menu a.active{background:#00823b}
.menu a.active{box-shadow:inset 4px 0 white}
.menu i{width:22px;text-align:center;font-style:normal;font-size:18px}

.main{margin-left:245px;padding:25px}

.header h1{color:#006400;font-size:27px}
.header p{color:#777;margin-top:5px}

.card{
background:#fff;border-radius:14px;padding:25px;
margin-top:22px;box-shadow:0 2px 12px rgba(0,0,0,.08);
max-width:1100px
}

.search-box{
display:flex;gap:10px;margin-bottom:22px
}

.search-box input{
flex:1;padding:12px;border:1px solid #ccc;
border-radius:7px;font-size:14px
}

button{
border:0;border-radius:7px;padding:12px 20px;
font-weight:bold;cursor:pointer
}

.btn-blue{background:#1c4fa3;color:white}
.btn-green{background:#006400;color:white}
.btn-red{background:#b00020;color:white}
.btn-gray{background:#777;color:white}

.form-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:18px
}

.form-group label{
display:block;font-weight:bold;font-size:13px;
margin-bottom:7px;color:#444
}

input,select,textarea{
width:100%;padding:12px;border:1px solid #ccc;
border-radius:7px;font-size:14px;background:white
}

textarea{height:90px;resize:vertical}

.full{grid-column:1/-1}

.message{
display:none;padding:12px;border-radius:7px;
margin-bottom:18px
}

.success{display:block;background:#dff5e4;color:#08752a}
.error{display:block;background:#ffe1e1;color:#a00000}

.branch-info{
margin-top:7px;color:#006400;
font-size:12px;font-weight:bold
}

.record-info{
background:#f1f7f2;padding:12px;
border-radius:7px;margin-bottom:18px;
font-size:13px;color:#555
}

@media(max-width:800px){

.sidebar{width:70px;padding:15px 8px}
.logo{font-size:0}
.logo:before{content:"MP";font-size:20px}
.logo small,.menu span{display:none}
.menu a{justify-content:center;padding:12px}

.main{margin-left:70px;padding:15px}

.form-grid{grid-template-columns:1fr}

.full{grid-column:auto}

.search-box{
flex-direction:column
}

}

</style>
</head>

<body>

<aside class="sidebar">

<div class="logo">
MPGB
<small>Hardware Management</small>
</div>

<nav class="menu">

<a href="index.html"><i>⌂</i><span>Dashboard</span></a>

<a href="add-hardware.html">
<i>＋</i><span>Add Hardware</span>
</a>

<a href="records.html">
<i>▣</i><span>Hardware Records</span>
</a>

<a href="edit-hardware.html">
<i>✎</i><span>Edit / Update</span>
</a>

<a href="branch-summary.html">
<i>▥</i><span>Branch Summary</span>
</a>

<a href="hardware-summary.html">
<i>◈</i><span>Hardware Summary</span>
</a>

<a href="reports.html">
<i>▤</i><span>Reports</span>
</a>

</nav>
</aside>


<main class="main">

<div class="header">

<h1>Edit / Update Hardware</h1>

<p>Search and update hardware record</p>

</div>


<div class="card">

<div id="message" class="message"></div>


<div class="search-box">

<input
type="text"
id="searchId"
placeholder="Enter Submission ID e.g. HW-20261008-123456-123">

<button
class="btn-blue"
onclick="searchRecord()">
Search
</button>

</div>


<div id="recordInfo" class="record-info" style="display:none">
</div>


<form id="editForm" style="display:none">

<div class="form-grid">


<div class="form-group">

<label>Submission ID</label>

<input
type="text"
id="submissionId"
readonly>

</div>


<div class="form-group">

<label>SOL ID *</label>

<select id="solId" required>
<option value="">Loading...</option>
</select>

<div id="branchInfo" class="branch-info"></div>

</div>


<div class="form-group">

<label>Hardware Type *</label>

<select id="hardwareType" required>

<option value="">Select Hardware Type</option>

<option>CPU</option>
<option>Monitor</option>
<option>Passbook Printer</option>
<option>Laser Printer</option>
<option>Scanner</option>
<option>CTS Machine</option>
<option>CCTV Monitor</option>
<option>Biometric Device</option>
<option>UPS</option>
<option>Other</option>

</select>

</div>


<div class="form-group">

<label>Hardware Sub Type</label>

<input id="hardwareSubType">

</div>


<div class="form-group">

<label>Make</label>

<input id="make">

</div>


<div class="form-group">

<label>Model</label>

<input id="model">

</div>


<div class="form-group">

<label>Serial No.</label>

<input id="serialNo">

</div>


<div class="form-group">

<label>Condition *</label>

<select id="condition" required>

<option value="">Select Condition</option>
<option>WORKING</option>
<option>NOT WORKING</option>
<option>UNDER REPAIR</option>
<option>DAMAGED</option>

</select>

</div>


<div class="form-group full">

<label>Remarks</label>

<textarea id="remarks"></textarea>

</div>


<div class="form-group full">

<button
type="submit"
class="btn-green"
id="updateBtn">
Update Hardware
</button>

<button
type="button"
class="btn-red"
onclick="deleteCurrent()">
Delete
</button>

<button
type="button"
class="btn-gray"
onclick="clearForm()">
Clear
</button>

</div>

</div>

</form>

</div>

</main>


<script>

var API_URL =
"https://script.google.com/macros/s/AKfycbyqpcO42kRHBBp_n1TEAHyI4SGGBNcf_5qQMN3ZARnZ4WLlUsgokf4k2BrHYfKX1lMB/exec";


var branchList=[];
var records=[];
var currentRecord=null;


document.addEventListener("DOMContentLoaded",function(){

setActiveMenu();

loadSOL();

});


/* ACTIVE MENU */

function setActiveMenu(){

var page=
window.location.pathname.split("/").pop().toLowerCase();

if(!page)page="index.html";

document.querySelectorAll(".menu a").forEach(function(a){

var href=
a.getAttribute("href").split("/").pop().toLowerCase();

if(href===page){
a.classList.add("active");
}

});

}


/* LOAD SOL */

function loadSOL(){

fetch(API_URL+"?action=getSOLList")

.then(function(r){
return r.json();
})

.then(function(result){

branchList=result.data||[];

var select=
document.getElementById("solId");

select.innerHTML=
'<option value="">Select SOL ID</option>';

branchList.forEach(function(branch){

var option=
document.createElement("option");

option.value=branch.solId;

option.textContent=
branch.solId+" - "+branch.branchName;

select.appendChild(option);

});


/* OPEN WITH ?id= */

var params=
new URLSearchParams(window.location.search);

var id=params.get("id");

if(id){

document.getElementById("searchId").value=id;

searchRecord();

}

})

.catch(function(error){

showMessage(
"Unable to load SOL list: "+error.message,
"error"
);

});

}


/* SEARCH RECORD */

function searchRecord(){

var id=
document.getElementById("searchId")
.value.trim();

if(!id){

showMessage(
"Please enter Submission ID.",
"error"
);

return;
}


fetch(API_URL+"?action=records")

.then(function(r){
return r.json();
})

.then(function(result){

records=
result.data ||
result.records ||
[];


var record=
records.find(function(x){

return String(x.submissionId).trim()===id;

});


if(!record){

document.getElementById("editForm").style.display="none";

showMessage(
"Record not found.",
"error"
);

return;
}


currentRecord=record;

fillForm(record);

showMessage(
"Record loaded successfully.",
"success"
);

})

.catch(function(error){

showMessage(
"Unable to load record: "+error.message,
"error"
);

});

}


/* FILL FORM */

function fillForm(r){

document.getElementById("editForm").style.display="block";

document.getElementById("recordInfo").style.display="block";

document.getElementById("recordInfo").innerHTML=
"<b>Branch:</b> "+escapeHtml(r.branchName)+
" &nbsp; | &nbsp; "+
"<b>Submission ID:</b> "+escapeHtml(r.submissionId);


document.getElementById("submissionId").value=
r.submissionId||"";

document.getElementById("solId").value=
normalizeSol(r.solId);

document.getElementById("hardwareType").value=
r.hardwareType||"";

document.getElementById("hardwareSubType").value=
r.hardwareSubType||"";

document.getElementById("make").value=
r.make||"";

document.getElementById("model").value=
r.model||"";

document.getElementById("serialNo").value=
r.serialNo||"";

document.getElementById("condition").value=
r.condition||"";

document.getElementById("remarks").value=
r.remarks||"";

showBranch();

}


/* SOL CHANGE */

document.getElementById("solId")
.addEventListener("change",showBranch);


function showBranch(){

var sol=
document.getElementById("solId").value;

var branch=
branchList.find(function(x){

return normalizeSol(x.solId)===normalizeSol(sol);

});

document.getElementById("branchInfo").innerText=
branch ? branch.branchName : "";

}


/* UPDATE */

document.getElementById("editForm")
.addEventListener("submit",function(e){

e.preventDefault();

if(!currentRecord)return;

var btn=
document.getElementById("updateBtn");

btn.disabled=true;
btn.innerText="Updating...";


var data={

action:"update",

submissionId:
document.getElementById("submissionId").value,

solId:
document.getElementById("solId").value,

hardwareType:
document.getElementById("hardwareType").value,

hardwareSubType:
document.getElementById("hardwareSubType").value,

make:
document.getElementById("make").value,

model:
document.getElementById("model").value,

serialNo:
document.getElementById("serialNo").value,

condition:
document.getElementById("condition").value,

remarks:
document.getElementById("remarks").value

};


fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

})

.then(function(r){
return r.json();
})

.then(function(result){

if(result.success || result.status==="success"){

showMessage(
"Hardware updated successfully.",
"success"
);

currentRecord=null;

}
else{

showMessage(
result.message||"Update failed.",
"error"
);

}

})

.catch(function(error){

showMessage(
"Error: "+error.message,
"error"
);

})

.finally(function(){

btn.disabled=false;
btn.innerText="Update Hardware";

});

});


/* DELETE */

function deleteCurrent(){

if(!currentRecord)return;

if(!confirm(
"Are you sure you want to delete this hardware record?"
))return;


fetch(API_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

action:"delete",

submissionId:
currentRecord.submissionId

})

})

.then(function(r){
return r.json();
})

.then(function(result){

if(result.success || result.status==="success"){

alert("Hardware deleted successfully.");

clearForm();

}
else{

showMessage(
result.message||"Delete failed.",
"error"
);

}

})

.catch(function(error){

showMessage(
"Error: "+error.message,
"error"
);

});

}


/* CLEAR */

function clearForm(){

currentRecord=null;

document.getElementById("editForm").reset();

document.getElementById("editForm").style.display="none";

document.getElementById("recordInfo").style.display="none";

document.getElementById("searchId").value="";

document.getElementById("branchInfo").innerText="";

}


/* NORMALIZE SOL */

function normalizeSol(value){

var s=String(value||"")
.replace(/\u00A0/g," ")
.trim();

var m=s.match(/\b\d{5}\b/);

return m ? m[0] : s.replace(/\s+/g,"");

}


/* MESSAGE */

function showMessage(text,type){

var box=
document.getElementById("message");

box.className="message "+type;

box.innerText=text;

box.style.display="block";

}


/* ESCAPE */

function escapeHtml(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

</script>

</body>
</html>
